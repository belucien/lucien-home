      <g fill="#8B8CF6" opacity=".6"><rect x="42" y="27" width="34" height="6" rx="3"/><rect x="42" y="55" width="28" height="6" rx="3"/><rect x="42" y="80" width="22" height="6" rx="3"/></g><circle cx="22" cy="83" r="6" fill="none" stroke="#8B8CF6" stroke-width="3"/></g>

<div class="app" id="root">
  <nav class="rail" aria-label="Lucien Home">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#04141D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
    <button class="rb" data-view="home" title="Home" aria-label="Home"><svg><use href="#i-home"/></svg><small>Home</small></button>
    <div id="railApps" class="railapps"></div>
    <button class="rb" data-view="calendar" title="Coming up" aria-label="Coming up"><svg><use href="#i-cal"/></svg><small>Coming up</small></button>
    <button class="rb" data-view="alerts" title="Notifications" aria-label="Notifications"><svg><use href="#i-bell"/></svg><small>Alerts</small><span class="badge" id="badge" hidden></span></button>
    <div class="grow"></div>
    <button class="rb" data-view="settings" title="Settings" aria-label="Settings"><svg><use href="#i-set"/></svg><span class="udot" id="udot" hidden></span></button>
    <div class="avatar" id="avatar" title="">?</div>
  </nav>
  <main id="main">
    <div class="topbar" id="topbar">
      <div class="tl"><div class="navarrows"><button id="back" aria-label="Back" title="Back (Alt+Left)"><svg><use href="#i-left"/></svg></button><button id="fwd" aria-label="Forward" title="Forward (Alt+Right)"><svg><use href="#i-right"/></svg></button></div></div>
      <div class="tc"><button class="search" id="searchBtn"><svg><use href="#i-search"/></svg><span>Search dates, bills, lists, settings</span><kbd>Ctrl K</kbd></button>
        <div class="appbar" id="appbar" hidden></div></div>
      <div class="tr"><button class="updbtn" id="updBtn" hidden></button><button class="tb" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
        <div class="wc" role="group" aria-label="Window">
          <button data-win="min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
          <button data-win="max" id="maxBtn" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" id="maxIc"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          <button data-win="close" class="close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
        </div></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="search-ov" id="searchOv" hidden><div class="search-box" role="dialog" aria-label="Search">
  <div class="sinput"><svg><use href="#i-search"/></svg><input id="q" placeholder="Search dates, bills, lists, settings" autocomplete="off"><kbd>Esc</kbd></div>
  <div id="results" class="results"></div></div></div>
<div class="welcome-ov" id="welcomeOv" hidden><div class="wbox" role="dialog" aria-modal="true" aria-labelledby="wTitle"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ctip" id="ctip" hidden></div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body></html>
