/* Update balance: set what a card or loan owes today (or add to it). Logged history stays, the stored starting point is adjusted so the live balance comes out exactly right. */
function balTarget(v){
  if(v.what==="card"){ const c=cardsFor(D.people).find(x=>x.row===+v.ref); return c?{rec:c,name:c.name,live:c.live,logged:c.live-c.balance}:null; }
  const l=D.loans.find(x=>x.id===v.ref); return l?{rec:l,name:l.name,live:liveLoan(l).live}:null;
}
function balNew(v){ const B=balTarget(v), a=r2(v.amount); if(!B||!(a>0||(v.mode==="set"&&String(v.amount).trim()!==""&&a===0))) return null; return v.mode==="add"?r2(B.live+a):a; }
function balPreview(v){
  const B=balTarget(v), n=balNew(v); if(!B) return "";
  if(n==null) return `<div class="ic">${ICON.info}</div><div><div class="t">${v.mode==="set"?"Type the new balance":"Type the amount added"}</div><div class="s">You'll see the new payoff here.</div></div>`;
  const d=n-B.live, chg=`${d>=0?"up":"down"} ${money(Math.abs(d))} from ${money(B.live)}`;
  if(v.what==="card"){ const c=B.rec, u=c.limit>0?n/c.limit*100:0, pm=Math.max(25,n*0.01+n*c.apr/1200), am=amortize(n,c.apr,pm);
    return `<div class="ic">${ICON.info}</div><div><div class="t">New balance ${money(n)}</div><div class="s">${chg} · ${u.toFixed(1)}% of the ${money0(c.limit)} limit${n>0&&!am.never?` · about ${am.n} months at minimum payments`:""}</div></div>`; }
  const l=B.rec, pay=+v.payment||l.payment, am=amortize(n,l.apr,pay);
  return `<div class="ic">${ICON.info}</div><div><div class="t">New balance ${money(n)}</div><div class="s">${chg} · ${am.never?"the payment doesn't cover the interest":am.n===0?"paid off":`paid off by ${mlabel(addMonths(curK(),am.n))} at ${money0(pay)}/mo, ${money0(am.interest)} interest`}</div></div>`;
}
/* keep digits and one decimal point (2 places); "$1,234.5" pasted becomes 1234.5 */
function moneyText(t){ t=String(t).replace(/[^0-9.]/g,""); const i=t.indexOf("."); if(i>=0) t=t.slice(0,i+1)+t.slice(i+1).replace(/\./g,"").slice(0,2); return t; }
function grab(){ if(!S) return; document.querySelectorAll("#sheet [data-k]").forEach(el=>{ S.vals[el.dataset.k]= el.type==="checkbox"?el.checked: el.value; }); }
function rerender(focusKey){ const sc=$("#sheet").scrollTop; renderSheet(); $("#sheet").scrollTop=sc;
  if(focusKey){ const n=$(`#sheet [data-k="${focusKey}"]`); if(n && n.type!=="range" && n.tagName!=="SELECT" && n.type!=="checkbox"){ n.focus(); try{ const L=n.value.length; n.setSelectionRange(L,L);}catch(_){} } } }

$("#sheet").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b||!S) return; const ds=b.dataset;
  if(ds.me){ store.set("ff_me",ds.me); closeSheet(); toast(`Hi ${ds.me}`); render(); rememberHere(); return; }
  if(ds.close) return closeSheet();
  if(ds.kind){ grab(); const keep={amount:S.vals.amount,date:S.vals.date,person:S.vals.person}; S.kind=ds.kind; S.vals=keep; S.err=""; return renderSheet(); }
  if(ds.sheetgo){ closeSheet(); view=ds.sheetgo; render(); scrollTo(0,0); return; }
  if(ds.switch){ grab(); openSheet(ds.switch,{vals:{person:S.vals.person}}); return; }
  if(ds.segk){ grab(); S.vals[ds.segk]=ds.segv; return rerender(); }
  if(ds.setbal){ const [what,ref]=ds.setbal.split(":"); openSheet("balance",{vals:{what,ref,mode:"set"}}); return; }
  if(ds.del){ S.confirmDel=true; return rerender(); }
  if(ds.nodel){ S.confirmDel=false; return rerender(); }
  if(ds.yesdel){ b.disabled=true; const tab={txn:"Transactions",cc:"Transactions",pay:"Salaries",card:"CreditCards",goal:"Goals",bill:"Bills",loan:"Loans"}[S.kind];
    const r=await write("deleteRow",tab,S.rec.row,S.rec.fp); if(r.ok){ closeSheet(); toast("Deleted"); } else if(S){ S.err=r.msg; S.confirmDel=false; renderSheet(); } return; }
  if(ds.stopcb){ b.disabled=true; grab(); const cat=S.vals.category; const r=await write("setCategoryBudget",{person:S.vals.owner,month:curK(),category:cat,budget:0}); if(r.ok){closeSheet();toast(`Stopped budgeting ${cat}`);} else if(S){S.err=r.msg;renderSheet();} return; }
  if(ds.repeatToday){ grab(); const vals=Object.assign({},S.vals,{date:D.today}); openSheet(S.kind,{vals}); toast("Copied. Check it and tap Save"); return; }
});
$("#sheet").addEventListener("input",e=>{ if(!S) return; const k=e.target.dataset.k;
  if(k==="amount"||k==="target"||k==="starting"){ const el=e.target, clean=moneyText(el.value); if(clean!==el.value){ const p=el.selectionStart-(el.value.length-clean.length); el.value=clean; try{ el.setSelectionRange(p,p); }catch(_){} } }
  if(k==="share"){ grab(); rerender(); }

$("#sheet").addEventListener("change",e=>{ if(!S) return; const k=e.target.dataset.k; if(!k) return; grab();

        const paidToday=sum(D.loanPayments.filter(p=>p.loanId===l.id&&p.date===D.today).map(p=>p.amount));   // today's payments are already in the number you typed
        fn="updateRow"; args=["Loans",l.row,l.fp,{person:l.person,name:l.name,kind:l.kind,lender:l.lender,balance:r2(n+paidToday),asOf:D.today,
          original:v.mode==="add"?r2((l.original||B.live)+(n-B.live)):Math.max(l.original||0,n),apr:l.apr,payment:pay,dueDay:l.dueDay,start:l.start}]; }
      msg=`Balance updated to ${money(n)}`; }
    if(k==="appname"){ const nm=String(v.name||"").replace(/\s+/g," ").trim(); need(nm,"Type a name for the app."); fn="setAppName"; args=[{name:nm,addYear:!!v.addYear}]; msg="App renamed"; }
    if(k==="goalmove"){ need(amt>0,"Enter an amount."); fn="addGoalMove"; args=[{goalId:v.goalId,date:v.date,person:v.person,amount:v.dir==="Withdraw"?-amt:amt,note:v.note||""}]; msg=v.dir==="Withdraw"?"Withdrawal saved":"Added to goal"; }
  }catch(err){ S.err=err.message; rerender(); return; }
  const btn=$("#sSave"); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  const kind=S.kind, r=await write(fn,...args);
  if(!S) return;
  if(r.ok){ closeSheet(); toast(msg);
    if(kind==="card"||(kind==="balance"&&ui.debt==="cards")){ view="cards"; ui.debt="cards"; render(); }
    else if(kind==="loan"||kind==="loanpay"){ if(view!=="dates"){ view="cards"; ui.debt="loans"; } render(); }
    else if(kind==="bill"){ view="dates"; render(); }
    else if(kind==="goal"||kind==="goalmove"){ view="plan"; ui.plan="goals"; render(); }
    else if(kind==="catbudget"){ view="plan"; ui.plan="budgets"; render(); } }
  else { S.err=r.msg; renderSheet(); }
});

/* ======================================================================
   EVENTS (page)
   ====================================================================== */
const openTxn=t=>{ if(t.category==="Credit Card") openSheet("cc",{rec:t,vals:{person:t.person,dir:t.amount<0?"Payment":"Charge",amount:Math.abs(t.amount),card:t.sub,date:t.date,desc:t.desc}});
  else openSheet("txn",{rec:t,vals:{person:t.person,type:t.type,amount:t.amount,desc:t.desc,cat:t.category,sub:t.sub,method:t.method,date:t.date}}); };
document.addEventListener("click",async e=>{
  if(e.target.closest("#sheet")) return;
  const b=e.target.closest("button,[data-edit-cb]"); if(!b) return;
  const ds=b.dataset;
  if(ds.go){ view=ds.go; store.set("ff_view",view); render(); scrollTo(0,0); return; }
  if(ds.scope){ scope=ds.scope; store.set("ff_scope",scope); ui.sim=null; ui.act.sub=""; ui.act.cat=""; render(); return; }
  if(ds.setbal){ const [what,ref]=ds.setbal.split(":"); openSheet("balance",{vals:{what,ref,mode:"set"}}); return; }
  if(ds.add){ const vals={}; if(ds.person) vals.person=ds.person; if(ds.goal) vals.goalId=ds.goal; if(ds.loan) vals.loanId=ds.loan; openSheet(ds.add,{vals}); return; }
  if(ds.repeat){ const t=D.transactions.find(x=>x.row===+ds.repeat); if(t) openSheet("txn",{vals:{person:t.person,type:t.type,amount:t.amount,desc:t.desc,cat:t.category,sub:t.sub,method:t.method,date:D.today}}); return; }
  if(ds.editTxn){ const t=D.transactions.find(x=>x.row===+ds.editTxn); if(t) openTxn(t); return; }
  if(ds.editPay){ const s=D.salaries.find(x=>x.row===+ds.editPay); if(s) openSheet("pay",{rec:s,vals:{person:s.person,ptype:s.type,amount:s.amount,date:s.date,freq:s.frequency,source:s.source}}); return; }
  if(ds.editCard){ const c=D.cards.find(x=>x.row===+ds.editCard); if(c) openSheet("card",{rec:c,vals:{person:c.person,date:c.date,name:c.name,limit:c.limit,apr:c.apr,balance:c.balance}}); return; }
  if(ds.editBill){ const b=D.bills.find(x=>x.id===ds.editBill); if(b) openSheet("bill",{rec:b,vals:{name:b.name,owner:b.owner,split:b.split,paidBy:b.paidBy,amount:b.amount,frequency:b.frequency,start:b.start,cat:b.category,sub:b.sub,method:b.method,autopay:b.autopay,notes:b.notes}}); return; }
  if(ds.editLoan){ const l=D.loans.find(x=>x.id===ds.editLoan); if(l) openSheet("loan",{rec:l,vals:{person:l.person,name:l.name,kind:l.kind,lender:l.lender,balance:l.balance,asOf:l.asOf,original:l.original||"",apr:l.apr,payment:l.payment,dueDay:l.dueDay,start:l.start}}); return; }
  if(ds.paybill){ const [type,id,due]=ds.paybill.split(":"), x=dueEntries(addDaysS(due,-1),addDaysS(due,1)).find(e=>e.type===type&&e.id===id&&e.due===due); if(x) openSheet("paybill",{vals:{x}}); return; }
  if(ds.unpay){ const [type,row]=ds.unpay.split(":"), tab=type==="loan"?"LoanPayments":"BillPaid", r=(type==="loan"?D.loanPayments:D.billPaid).find(p=>p.row===+row); if(!r) return;
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Sure?"; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=""; b.textContent=type==="loan"&&view!=="dates"?"Delete":"Undo"; } },4000); return; }
    b.disabled=true; const res=await write("deleteRow",tab,r.row,r.fp); toast(res.ok?"Reopened. Any spending entry it logged is still in Activity":res.msg); return; }
  if(ds.debt){ ui.debt=ds.debt; render(); return; }
  if(ds.editGoal){ const g=D.goals.find(x=>x.id===ds.editGoal); if(g) openSheet("goal",{rec:g,vals:{name:g.name,owner:g.owner,target:g.target,targetDate:g.targetDate,starting:g.starting}}); return; }
  if(ds.editCb){ const bb=catBudgetRows().find(x=>x.category===ds.editCb); if(bb) openSheet("catbudget",{rec:bb,vals:{category:bb.category,owner:scope,amount:bb.budget,month:curK()}}); return; }
  if(ds.actTab){ ui.act.tab=ds.actTab; ui.act.cat=ui.act.sub=ui.act.method=""; ui.act.limit=60; render(); return; }
  if(ds.more){ ui.act.limit+=60; $("#actBody").innerHTML=activityBody(); return; }
  if(ds.plan){ ui.plan=ds.plan; render(); return; }
  if(ds.strategy){ ui.payoff[scope].strategy=ds.strategy; render(); return; }
  if(ds.goto){ const [v,sub]=ds.goto.split(":"); view=v; if(v==="plan"&&sub) ui.plan=sub; render(); scrollTo(0,0); return; }
  if(ds.toggleIns){ ui.allIns=!ui.allIns; render(); return; }
  if(ds.insight){ const g=ds.insight;
    if(g==="budget") return openSheet("budget");
    if(g.startsWith("txn:")){ const t=D.transactions.find(x=>x.row===+g.slice(4)); if(t) openTxn(t); return; }
    if(g.startsWith("activity")){ view="activity"; Object.assign(ui.act,{tab:"spend",month:curK(),cat:"",sub:g.split(":")[1]||"",method:"",q:"",limit:60}); }
    else if(g==="goals"){ view="plan"; ui.plan="goals"; } else if(g==="plan"){ view="plan"; ui.plan="budgets"; } else view=g;
    render(); scrollTo(0,0); return; }
  if(ds.monthAll){ ui.months[scope]=[]; render(); return; }
  if(ds.month){ const a=ui.months[scope]||(ui.months[scope]=[]), i=a.indexOf(ds.month); i<0?a.push(ds.month):a.splice(i,1); render(); return; }
  if(ds.reuse){ const last=lastBudget(ds.reuse); if(!last) return; b.disabled=true; const r=await write("setBudget",{person:ds.reuse,month:curK(),budget:last.budget}); toast(r.ok?`${ds.reuse}'s budget set to ${money0(last.budget)}`:r.msg); return; }
  if(ds.reuseBudget){ b.disabled=true; for(const p of overallBudget().missing){ const last=lastBudget(p); if(last){ const r=await write("setBudget",{person:p,month:curK(),budget:last.budget}); if(!r.ok){ toast(r.msg); return; } } } toast("Budget carried over"); return; }
});
document.addEventListener("keydown",e=>{ const el=e.target.closest&&e.target.closest("[data-edit-cb]"); if(el&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); el.click(); } });
document.addEventListener("input",e=>{
  const el=e.target; if(el.closest("#sheet")) return;
  if(el.dataset&&el.dataset.af){ ui.act[el.dataset.af]=el.value; ui.act.limit=60; if(el.dataset.af==="q") $("#actBody").innerHTML=activityBody(); else render(); return; }
  if(el.id==="lsimExtra"){ ui.lsim.extra=parseFloat(el.value)||0; const o=$("#lsimOut"); if(o) o.innerHTML=lsimOut(D.loans.find(l=>l.id===ui.lsim.id)); return; }
  if(el.id==="simPay"){ ui.sim.pay=parseFloat(el.value)||0; simUpdate(); }
  if(el.id==="simMo"){ ui.sim.months=+el.value; $("#simMoLbl").textContent=el.value; simUpdate(); }
  if(el.id==="poMonthly"){ clearTimeout(ui._po); ui._po=setTimeout(()=>{ const v=parseFloat(el.value); if(v>0){ ui.payoff[scope].monthly=v; render(); const n=$("#poMonthly"); if(n){ n.focus(); } } },600); }
});
document.addEventListener("change",e=>{ if(e.target.closest("#sheet")) return;
  if(e.target.id==="lsimLoan"){ ui.lsim.id=e.target.value; const o=$("#lsimOut"); if(o) o.innerHTML=lsimOut(D.loans.find(l=>l.id===ui.lsim.id)); return; }
  if(e.target.id==="simCard"){ ui.sim.row=+e.target.value; simUpdate(); } });
try{ matchMedia("(min-width:0px)").addEventListener("change",()=>render()); }catch(_){}
let rsz; addEventListener("resize",()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(D&&!$("#app").hidden){ hideTip(); drawCharts(); } },150); });

/* ======================================================================
   BOOT
   ====================================================================== */
(async function boot(){
  const v=store.get("ff_view"); if(["home","activity","dates","plan","cards"].includes(v)) view=v;
  const sc=store.get("ff_scope"); if(sc) scope=sc;
  /* Personal link (…/exec?u=…) opens straight in as that person, no PIN. */
  const prm=await new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; res(v||{}); } };
    try{ google.script.url.getLocation(l=>fin(l&&l.parameter)); }catch(_){ fin({}); } setTimeout(()=>fin({}),2000); });
  if(prm.u){
    $("#lock").hidden=true; $("#app").hidden=false;
    try{ const cred="t:"+prm.u, d=await call("unlock",cred); PIN=cred; openApp(d); }
    catch(e){ showLock(errText(e)); }
    return;
  }
  const tok=store.get("ff_tok");
  if(tok){ $("#lock").hidden=true; $("#app").hidden=false;
    try{ const cred="t:"+tok, d=await call("unlock",cred); PIN=cred; openApp(d); try{ google.script.history.replace(null,{u:tok}); }catch(_){} return; }
    catch(e){ store.del("ff_tok"); } }
  const saved=store.get("ff_pin");
  if(!saved){ showLock(""); return; }
  $("#lock").hidden=true; $("#app").hidden=false;
  try{ PIN=saved; openApp(await call("unlock",saved)); }
  catch(e){ store.del("ff_pin"); showLock(isAuthErr(e)?errText(e):"Couldn't reach your Sheet. Check your connection and try again."); }
})();
