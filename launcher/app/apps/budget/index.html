<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shim.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__APP_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,700;112,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — header with scope switch (Household / each person), one view at a time,
   bottom tab bar on phones (top bar on desktop) with a raised Add button. Forms open as sheets. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#F4F6F5; --fg:#111917; --muted:#55625E; --line:#D7DEDB; --line2:#E6EBE9;
  --accent:#0E6B5C; --accent-fg:#FFFFFF; --accent-soft:#DCEFE9;
  --hero:#0F2A25; --hero-fg:#F1F7F5; --hero-muted:#A9C2BB; --hero-track:#28463F; --hero-accent:#7FE0C8;
  --good:#1E7B45; --warn:#9A6100; --bad:#B42318;
  --good-bg:#E3F3E9; --warn-bg:#FBF0DB; --bad-bg:#FBE4E2; --info-bg:#E6EEF9; --info:#2557A5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#E3E8E6;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
  color-scheme:light;
}
@media all{:root{
  --bg:#0C1110; --surface:#151C1A; --sunk:#111715; --fg:#E7EEEB; --muted:#97A5A0; --line:#26302D; --line2:#1E2724;
  --accent:#5CC4AE; --accent-fg:#0C1110; --accent-soft:#15332C;
  --hero:#123A32; --hero-fg:#EEF7F4; --hero-muted:#9FC1B8; --hero-track:#1E4F45; --hero-accent:#86E6CF;
  --good:#5DC489; --warn:#E8B04A; --bad:#F07A70;
  --good-bg:#14301F; --warn-bg:#352812; --bad-bg:#3A1A18; --info-bg:#172741; --info:#8CB4F0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#222B28; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;letter-spacing:-.01em;text-wrap:balance}
.money,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- lock ---------- */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.lockcard h1{font-size:1.6rem}
.pin{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.35em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);width:100%}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.err:empty{min-height:0}

/* ---------- shell ---------- */
.shell{max-width:1080px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.top .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.top .mark{width:34px;height:34px;border-radius:10px}
.top .mark svg{width:20px;height:20px}
.top h1{font-size:clamp(1.05rem,4.6vw,1.25rem);line-height:1.15;min-width:0;overflow-wrap:anywhere}
.titlebtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;border-radius:8px;color:var(--fg)}
.titlebtn .pen{width:15px;height:15px;color:var(--muted);flex:none;opacity:.55}
.titlebtn:hover .pen{opacity:1} .titlebtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ver{text-align:center;font-size:.74rem;color:var(--muted);padding:6px 0 0}
.ver .vwarn{color:var(--warn);font-weight:600}
.iconbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn:hover{color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.scope{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;width:max-content;max-width:100%}
.scope button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.scope button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.scope button:focus-visible{outline:2px solid var(--accent)}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.asof{font-size:.8rem;color:var(--muted)}

nav.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
nav.tabs button{all:unset;cursor:pointer;min-width:0;text-align:center;padding:6px 0;border-radius:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem}
nav.tabs button svg{width:22px;height:22px;display:block}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.fab{width:56px;height:56px;padding:0;border-radius:18px;margin:-26px 8px 0;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px rgba(14,107,92,.35)}
nav.tabs button.fab svg{width:26px;height:26px}
nav.tabs button.fab span{display:none}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
.shell{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))!important}
/* phones: docked edge to edge */
@media (max-width:700px){
  nav.tabs{left:0;right:0;transform:none;width:auto;bottom:0;border-radius:0;border-width:1px 0 0;box-shadow:none;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  nav.tabs button{font-size:.68rem;padding:5px 0}
  nav.tabs button.fab{width:54px;height:54px;margin:-22px 6px 0}
}

/* ---------- common blocks ---------- */
.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.ph h3{font-size:1.02rem}
.ph .muted{font-size:.82rem}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.link:focus-visible{outline:2px solid var(--accent)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--sunk);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;min-width:0}
.stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.18rem;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.stat .d{font-size:.8rem;margin-top:2px;color:var(--muted)}
.up{color:var(--bad)} .down{color:var(--good)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:6px 12px;font-size:.86rem;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.bar{height:10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line2);position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5;border-radius:1px}

/* next bill card (like the Planner's countdown) */
.nextbill{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.nextbill .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.nextbill.late .eyebrow{color:var(--bad)}
.nbtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.nbname{font-weight:700;font-size:1.2rem;margin-top:4px;overflow-wrap:anywhere}
.nbcount{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.nbcount b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:clamp(2.6rem,10vw,3.6rem);line-height:.9;color:var(--accent)}
.nextbill.late .nbcount b{color:var(--bad)}
.nbcount span{font-weight:700;font-size:1.05rem}
.nbsub{color:var(--muted);margin-top:8px;font-size:.92rem} .nbsub b{color:var(--fg);font-family:var(--f-num,inherit)}
.caltile{flex:none;width:72px;border-radius:14px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.caltile .m{background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:.72rem;letter-spacing:.08em;padding:5px 0}
.nextbill.late .caltile .m{background:var(--bad);color:#fff}
.caltile .d{font-weight:800;font-size:1.6rem;padding:6px 0 8px}
.nbbtns{display:flex;gap:8px;flex-wrap:wrap}
.nbnone{margin-top:6px;color:var(--muted)}
.nextbill.empty-nb{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
.nbrest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:14px}
.nbmini{all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.nbmini .c{display:flex;align-items:baseline;gap:4px} .nbmini .c b{font-weight:800;font-size:1.3rem} .nbmini .c span{font-weight:600;font-size:.85rem}
.nbmini.late .c b{color:var(--bad)}
.nbmini .n{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbmini .a{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbmini:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.datesjump{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--accent);font-weight:600;font-size:.9rem}
.datesjump svg{width:18px;height:18px} .datesjump span{margin-left:auto}
.datesjump:focus-visible{outline:2px solid var(--accent)}
@media (max-width:420px){ .nbrest{gap:6px} .caltile{width:62px} }
/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--hero-muted);font-weight:700}
.hero .big{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1;letter-spacing:-.02em}
.hero .big small{font-size:.42em;font-weight:600;color:var(--hero-muted);letter-spacing:0;margin-left:6px}
.hero .track{height:12px;border-radius:999px;background:var(--hero-track);position:relative}
.hero .track i{display:block;height:100%;border-radius:999px;background:var(--hero-accent)}
.hero .track.warn i{background:#F2C15B} .hero .track.bad i{background:#FF8A7E}
.hero .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--hero-fg);border-radius:1px;opacity:.8}
.hero .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--hero-muted)}
.hero .meta b{color:var(--hero-fg);font-family:var(--f-mono);font-weight:600}
.hero .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hero-track);padding-top:12px}
.hero .trio div{min-width:0}
.hero .trio .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--hero-muted);font-weight:700}
.hero .trio .v{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.hero .say{display:flex;gap:8px;align-items:center;font-size:.92rem}
.hero .say svg{width:18px;height:18px;flex:none}
.hero .say b{font-family:var(--f-mono)}
.hero .hbtn{all:unset;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--hero);background:var(--hero-accent);padding:7px 12px;border-radius:9px}
.hero .hbtn:focus-visible{outline:2px solid var(--hero-fg)}

/* insights */
.ins{display:flex;flex-direction:column;gap:8px}
.insight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border-radius:12px;background:var(--sunk);border:1px solid var(--line2)}
.insight .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.insight .ic svg{width:17px;height:17px}
.insight.good .ic{background:var(--good-bg);color:var(--good)} .insight.warn .ic{background:var(--warn-bg);color:var(--warn)}
.insight.bad .ic{background:var(--bad-bg);color:var(--bad)} .insight.info .ic{background:var(--info-bg);color:var(--info)}
.insight .t{font-weight:700;font-size:.93rem}
.insight .s{font-size:.86rem;color:var(--muted)}
.insight{grid-template-columns:auto minmax(0,1fr)}
.insight .go{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.84rem;padding:2px 0;white-space:nowrap;grid-column:2;justify-self:start}
.insight > span:empty{display:none}
.insight .go:focus-visible{outline:2px solid var(--accent)}

/* quick add */
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qchip{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;max-width:220px}
.qchip i{width:10px;height:10px;border-radius:3px;flex:none}
.qchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip b{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.qchip:focus-visible{outline:2px solid var(--accent)}
.qchip.new{color:var(--accent);font-weight:700;border-style:dashed}

/* lists */
.list{display:flex;flex-direction:column}
.dayh{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:14px 4px 6px;display:flex;justify-content:space-between}
.dayh:first-child{padding-top:2px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line2);width:100%}
.dayh + .item{border-top:0}
.item:hover{background:var(--sunk)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.item .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;font-family:var(--f-display)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.item .amt.pos{color:var(--good)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:700px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.f{display:flex;flex-direction:column;gap:5px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;min-width:0}
.f input,.f select,.searchrow input{text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f input[type=range]{padding:0;border:0;background:none}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button:focus-visible{outline:2px solid var(--accent)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:700}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.spark{display:inline-block;height:8px;border-radius:2px;background:var(--s2);vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{all:unset;cursor:pointer;font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip:focus-visible{outline:2px solid var(--accent)}

/* budgets & goals */
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 4px;border-top:1px solid var(--line2);cursor:pointer;border-radius:8px}
.brow:first-child{border-top:0;padding-top:4px}
.brow:hover{background:var(--sunk)}
.brow:focus-visible{outline:2px solid var(--accent)}
.brow .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.brow .nm i{width:10px;height:10px;border-radius:3px}
.brow .fig{font-family:var(--f-mono);font-size:.9rem;text-align:right}
.brow .bar{grid-column:1/-1}
.brow .note{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.goal{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.goal .gh{display:flex;gap:12px;align-items:center}
.ring{width:60px;height:60px;flex:none;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.goal .nm{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1.08rem}
.goal .amt{font-family:var(--f-mono);font-size:.92rem}
.goal .moves{font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.goal .moves div{display:flex;justify-content:space-between;gap:8px}

/* cards */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{border-radius:16px;padding:16px;background:var(--hero);color:var(--hero-fg);display:flex;flex-direction:column;gap:10px;min-height:170px}
.ccard .nm{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ccard .who{font-size:.78rem;color:var(--hero-muted)}
.ccard .bal{font-family:var(--f-mono);font-size:1.5rem;font-weight:600}
.ccard .track{height:8px;border-radius:999px;background:var(--hero-track);overflow:hidden}
.ccard .track i{display:block;height:100%;background:var(--hero-accent);border-radius:999px}
.ccard .track.warn i{background:#F2C15B} .ccard .track.bad i{background:#FF8A7E}
.ccard .ft{display:flex;justify-content:space-between;font-size:.82rem;color:var(--hero-muted);gap:8px;flex-wrap:wrap}
.ccard .ft b{color:var(--hero-fg);font-family:var(--f-mono);font-weight:600}
.ccard .edit{all:unset;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--hero-accent)}
.ccard .edit:focus-visible{outline:2px solid var(--hero-fg)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.sim{grid-template-columns:minmax(0,1fr)}}
input[type=range]{width:100%;accent-color:var(--accent)}

/* dates & loans */
.billrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line2)}
.billrow:first-child{border-top:0}
.billrow .dbox{width:58px;height:58px;border-radius:14px;background:var(--sunk);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.billrow .dbox b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:1.35rem}
.billrow .dbox small{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
.billrow.late .dbox{background:var(--bad-bg);border-color:transparent;color:var(--bad)} .billrow.late .dbox small{color:var(--bad)}
.billrow.soon .dbox{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .billrow.soon .dbox small{color:var(--warn)}
.billrow.paid .dbox{background:var(--good-bg);border-color:transparent;color:var(--good)} .billrow.paid .dbox small{color:var(--good)}
.billrow .body{all:unset;cursor:pointer;min-width:0;display:block}
.billrow .body:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.billrow .nm{font-weight:700;overflow-wrap:anywhere}
.billrow .sub{font-size:.82rem;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.billrow .amt{font-family:var(--f-mono);font-weight:600}
.billrow .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.loan{border-radius:16px;padding:16px;background:var(--hero);color:var(--hero-fg);display:flex;flex-direction:column;gap:10px}
.loan .nm{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.loan .who{font-size:.8rem;color:var(--hero-muted)}
.loan .bal{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.loan .track{height:8px;border-radius:999px;background:var(--hero-track);overflow:hidden}
.loan .track i{display:block;height:100%;background:var(--hero-accent);border-radius:999px}
.loan .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:.84rem;color:var(--hero-muted)}
.loan .grid b{display:block;color:var(--hero-fg);font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.loan .acts{display:flex;gap:8px;flex-wrap:wrap}
.loan .hbtn{all:unset;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--hero);background:var(--hero-accent);padding:7px 12px;border-radius:9px}
.loan .lbtn{all:unset;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--hero-accent);padding:7px 4px}
.loan .hbtn:focus-visible,.loan .lbtn:focus-visible{outline:2px solid var(--hero-fg)}

/* charts */
.chart{position:relative;height:250px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart text.num{font-family:var(--f-mono)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .seg-hl{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed;border-radius:0;width:14px}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.84rem;box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:130px;max-width:260px}
#tip b{display:block;margin-bottom:4px}
#tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
#tip span.money{margin-left:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:701px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
@media (min-width:701px){.sheet{border-radius:18px;padding:20px;max-height:100%}.sheet::before{display:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:1.2rem}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2 .full{grid-column:1/-1}
.amtbig{display:flex;align-items:center;gap:4px;border-bottom:2px solid var(--line);padding:4px 2px}
.amtbig:focus-within{border-color:var(--accent)}
.amtbig span{font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--muted)}
.amtbig input{all:unset;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:2.4rem;width:100%;min-width:0}
.splitbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.summary{font-size:.88rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.summary b{color:var(--fg)}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 2px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sticky-actions .btn.primary{flex:1;max-width:260px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px}
.hint{font-size:.84rem;color:var(--muted);margin:0}
label.cb{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
label.cb input{width:20px;height:20px;accent-color:var(--accent);margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center;font-weight:600}
.toast.on{opacity:1}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.seg.wrap{flex-wrap:wrap;overflow:visible;white-space:normal}
.seg.wrap button{flex:1 1 auto}
.ccard .nm .nmb{display:flex;gap:6px;flex:none}
</style>
</head>
<body>

<!-- ============ lock ============ -->
<section id="lock">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l3-2V4h3v2l2-1 2 1V4h3v3l3 2v12z"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg></div>
    <h1 class="appname">__APP_NAME__</h1>
    <p class="muted" style="margin:0">Enter your shared PIN to open your finances.</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" aria-label="PIN" autocomplete="off">
    <label class="row" style="font-size:.92rem"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <div class="err" id="lockErr" role="alert"></div>
    <button class="btn primary" type="submit" id="unlockBtn">Unlock</button>
    <div class="ver" id="lockVer"></div>
  </form>
</section>

<!-- ============ app ============ -->
<div class="shell" id="app" hidden>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l3-2V4h3v2l2-1 2 1V4h3v3l3 2v12z"/><path d="M10 21v-5a2 2 0 0 1 4 0v5"/></svg></div>
      <button class="titlebtn" id="titleBtn" title="Rename the app" aria-label="Rename the app"><h1 class="appname">__APP_NAME__</h1><svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="iconbtn" id="lockBtn" title="Lock" aria-label="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-go="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Activity</button>
    <button class="fab" data-add="txn" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
    <button data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Plan</button>
    <button data-go="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Debt</button>
  </nav>

  <div class="subbar"><div class="scope" id="scope" role="group" aria-label="Whose money"></div><span class="asof" id="asof"></span></div>

  <main id="view" class="view"><div class="loading">Loading your numbers…</div></main>
  <div class="ver" id="verLine"></div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="tip" hidden></div>

<script>
const CLIENT_VERSION="2026.11.10";
function showAppName(full){ document.querySelectorAll(".appname").forEach(e=>e.textContent=full); document.title=full; }
if(/__APP_NAME__/.test(document.querySelector(".appname").textContent)) showAppName("Family Budget Log "+new Date().getFullYear());
document.getElementById("lockVer").textContent="Version "+CLIENT_VERSION;

/* ======================================================================
   STATE & UTILITIES
   ====================================================================== */
let PIN=null, D=null, view="home", scope="Household", busy=0, linkMe=null;
const ui={act:{tab:"spend",q:"",month:"",cat:"",sub:"",method:"",limit:60}, plan:"budgets", months:{}, sim:null, payoff:{}, allIns:false, debt:"cards", lsim:null};
let S=null;   // open sheet state

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const money=(n,d=2)=>(n<0?"−":"")+"$"+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money0=n=>money(n,0);
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const uniqSorted=a=>[...new Set(a.filter(Boolean))].sort();
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const mkey=d=>String(d||"").slice(0,7);
const mlabel=k=>{const[y,m]=k.split("-");return MON[+m-1]+" "+y;};
const mlabelF=k=>{const[y,m]=k.split("-");return MONF[+m-1]+" "+y;};
const mname=k=>MONF[+k.split("-")[1]-1];
const addMonths=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+String(m).padStart(2,"0");};
const dim=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate();};
const dayOf=d=>+String(d).slice(8,10);
const parseD=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function dayLabel(d){ const diff=daysBetween(d,D.today); if(diff===0)return"Today"; if(diff===1)return"Yesterday"; const x=parseD(d); return `${DOW[x.getDay()]}, ${MON[x.getMonth()]} ${x.getDate()}`+(x.getFullYear()!==parseD(D.today).getFullYear()?` ${x.getFullYear()}`:""); }
const ICON={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 18h0"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h0"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h0"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  goal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),ms);}
function call(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));}
function errText(e){return String((e&&e.message)||e||"Something went wrong.").replace(/^Error:\s*/,"").replace(/^(PIN|LOCKED|LINK):\s*/,"");}
function isAuthErr(e){return /^(Error:\s*)?(PIN|LOCKED|LINK):/.test(String((e&&e.message)||e||""));}

/* ======================================================================
   LOCK / DATA
   ====================================================================== */
function showLock(msg){PIN=null;$("#app").hidden=true;$("#lock").hidden=false;closeSheet();$("#lockErr").textContent=msg||"";$("#pin").value="";setTimeout(()=>$("#pin").focus(),50);}
$("#lockForm").addEventListener("submit",async e=>{
  e.preventDefault(); const pin=$("#pin").value.trim(); if(!pin) return;
  const b=$("#unlockBtn"); b.disabled=true; b.textContent="Checking…"; $("#lockErr").textContent="";
  try{ const d=await call("unlock",pin); PIN=pin; wantRemember=$("#remember").checked; if(wantRemember) store.set("ff_pin",pin); else store.del("ff_pin"); openApp(d); rememberHere(); }
  catch(err){ $("#lockErr").textContent=errText(err); $("#pin").select(); }
  b.disabled=false; b.textContent="Unlock";
});
$("#lockBtn").addEventListener("click",()=>{store.del("ff_pin");store.del("ff_tok");showLock("Locked. Enter the PIN to open again.");});
/* "Remember on this device": phones (iPhone especially) wipe what web apps save, so instead the
   app's own address gets this person's sign-in code (?u=…). Opening that address skips the PIN. */
let wantRemember=false;
async function rememberHere(){
  if(!wantRemember || linkMe || !PIN || /^t:/.test(PIN)) return;
  const who=store.get("ff_me"); if(!D || !D.people.includes(who)) return;   // asked once "who's using this phone" first
  try{
    const tok=await call("rememberDevice",PIN,who); wantRemember=false;
    linkMe=who; store.set("ff_tok",tok);
    google.script.history.replace(null,{u:tok});
    toast(`Remembered. This phone opens as ${who} without the PIN. On iPhone, if you use a Home Screen icon, add it again once (Share › Add to Home Screen).`, 8000);
  }catch(_){}
}
function openApp(d){ $("#lock").hidden=true; $("#app").hidden=false; if(d.me){ linkMe=d.me; store.set("ff_me",d.me); } apply(d); if(!linkMe && !D.people.includes(store.get("ff_me"))) openSheet("whoami"); }
function appFullName(){ return (D.appName||"Family Budget Log")+(D.addYear===false?"":" "+new Date().getFullYear()); }
function updateVersion(){
  const sv=D&&D.version, el=$("#verLine"); if(!el) return;
  if(!sv) el.innerHTML=`Version ${CLIENT_VERSION} · <b class="vwarn">Code.gs is older. Paste the new Code.gs too, then deploy a new version.</b>`;
  else if(sv!==CLIENT_VERSION) el.innerHTML=`Version ${CLIENT_VERSION} · <b class="vwarn">Code.gs is ${esc(sv)}. Paste both files from the same update, then deploy a new version.</b>`;
  else el.textContent=`Version ${CLIENT_VERSION}`;
}
function apply(d){
  D=d; showAppName(appFullName()); D.goals=D.goals||[]; D.goalMoves=D.goalMoves||[]; D.catBudgets=D.catBudgets||[];
  D.bills=D.bills||[]; D.billPaid=D.billPaid||[]; D.loans=D.loans||[]; D.loanPayments=D.loanPayments||[]; D.billFreqs=D.billFreqs||["Weekly","Biweekly","Monthly","Quarterly","Yearly","One-time"]; D.loanKinds=D.loanKinds||["Car","Personal","Student","Mortgage","Other"];
  if(scope!=="Household" && !D.people.includes(scope)) scope="Household";
  $("#asof").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  updateVersion();
  render();
}
async function refresh(quiet){
  if(!PIN||busy) return; const b=$("#refreshBtn"); b.classList.add("spin");
  try{ const d=await call("getAll",PIN); if(!busy) apply(d); if(!quiet) toast("Up to date"); }
  catch(e){ if(isAuthErr(e)){store.del("ff_pin");showLock(errText(e));} else if(!quiet) toast(errText(e)); }
  b.classList.remove("spin");
}
async function write(fn,...args){
  busy++;
  try{ const d=await call(fn,PIN,...args); busy--; apply(d); return {ok:true}; }
  catch(e){ busy--; if(isAuthErr(e)){store.del("ff_pin");showLock(errText(e));} return {ok:false,msg:errText(e)}; }
}

/* ======================================================================
   CALCULATIONS
   Spending = Expense rows outside the Credit Card category (card rows track debt).
   Income   = pay entries of type Income or Tax Return + Income-type transactions.
   Savings & Stock pay entries count as money set aside, not income.
   ====================================================================== */
const PS=()=>scope==="Household"?D.people:[scope];
const inScope=p=>PS().includes(p);
const isSpend=t=>t.type==="Expense" && t.category!=="Credit Card";
const spendOf=(ps=PS())=>D.transactions.filter(t=>ps.includes(t.person)&&isSpend(t));
const incomeRows=(ps=PS())=>[
  ...D.salaries.filter(s=>ps.includes(s.person)&&(s.type==="Income"||s.type==="Tax Return")).map(s=>({date:s.date,amount:s.amount})),
  ...D.transactions.filter(t=>ps.includes(t.person)&&t.type==="Income"&&t.category!=="Credit Card").map(t=>({date:t.date,amount:t.amount}))];
const savedRows=(ps=PS())=>D.salaries.filter(s=>ps.includes(s.person)&&(s.type==="Savings"||s.type==="Stock"));
const curK=()=>mkey(D.today);
const inMonth=(rows,k)=>rows.filter(r=>mkey(r.date)===k);
const upToDay=(rows,k,day)=>rows.filter(r=>mkey(r.date)===k && dayOf(r.date)<=day);
function monthlyTotals(rows){const m={};rows.forEach(r=>{const k=mkey(r.date);if(k)m[k]=(m[k]||0)+r.amount;});return m;}

function overallBudget(k=curK(), ps=PS()){
  let total=0, any=false; const missing=[];
  ps.forEach(p=>{ const b=D.budgets.find(b=>b.person===p&&mkey(b.date)===k); if(b){total+=b.budget;any=true;} else missing.push(p); });
  return {total, any, missing};
}
function lastBudget(p, k=curK()){ return D.budgets.filter(b=>b.person===p&&mkey(b.date)<k).sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }

function pace(ps=PS()){
  const k=curK(), day=dayOf(D.today), n=dim(k), prevK=addMonths(k,-1);
  const sp=spendOf(ps), mtd=sum(upToDay(sp,k,day).map(t=>t.amount));
  const prevSame=sum(upToDay(sp,prevK,Math.min(day,dim(prevK))).map(t=>t.amount));
  const forecast= day>=5 ? mtd/day*n : null;
  const inc=sum(inMonth(incomeRows(ps),k).map(r=>r.amount));
  const saved=sum(inMonth(savedRows(ps),k).map(r=>r.amount));
  return {k,day,n,left:n-day,mtd,prevSame,forecast,inc,saved,cash:inc-mtd};
}

/* PC-app key numbers, by months that have data */
function kpis(ps=PS()){
  const m=monthlyTotals(spendOf(ps)), keys=Object.keys(m).sort(); if(!keys.length) return null;
  const avg=sum(keys.map(k=>m[k]))/keys.length, maxK=keys.reduce((a,b)=>m[b]>m[a]?b:a);
  const cur=keys[keys.length-1], prev=keys.length>1?keys[keys.length-2]:null;
  const dAmt=prev?m[cur]-m[prev]:0, dPct=prev&&m[prev]?dAmt/m[prev]*100:0;
  return {avg,maxK,maxV:m[maxK],cur,curV:m[cur],prev,dAmt,dPct};
}

/* Category budgets: a row applies from its month until a later row for the same owner+category. 0 = stopped. */
function catBudgetRows(owner=scope){
  const k=curK(), latest={};
  D.catBudgets.filter(b=>b.person===owner&&b.month<=k).sort((a,b)=>a.month.localeCompare(b.month)).forEach(b=>latest[b.category]=b);
  return Object.values(latest).filter(b=>b.budget>0).sort((a,b)=>a.category.localeCompare(b.category));
}
const ownerPeople=o=>o==="Household"?D.people:[o];
function catSpent(cat,owner=scope,k=curK()){ return sum(spendOf(ownerPeople(owner)).filter(t=>t.sub===cat&&mkey(t.date)===k).map(t=>t.amount)); }
function catStatus(spent,budget,p){ const used=budget?spent/budget*100:0, expected=p.day/p.n*100;
  return used>100?"bad": used>=90 || (p.day>=7 && used>expected+15) ? "warn":"good"; }
function subColor(sub){ const t=D.transactions.find(x=>x.sub===sub&&x.category!=="Credit Card"); return catColor(t?t.category:"Other"); }

/* Goals */
function goalSaved(g){ return g.starting+sum(D.goalMoves.filter(m=>m.goalId===g.id).map(m=>m.amount)); }
function goalInfo(g){
  const saved=goalSaved(g), left=Math.max(0,g.target-saved), pct=g.target?Math.max(0,Math.min(100,saved/g.target*100)):0;
  let monthsLeft=null, need=null;
  if(g.targetDate){ monthsLeft=Math.max(daysBetween(D.today,g.targetDate)/30.44,0); need= left>0 ? left/Math.max(1,monthsLeft) : 0; }
  const since=Math.min(90, Math.max(30, daysBetween(g.created||D.today, D.today)));
  const recent=sum(D.goalMoves.filter(m=>m.goalId===g.id && daysBetween(m.date,D.today)<=since && m.amount>0).map(m=>m.amount));
  const avgMo=recent/(since/30.44);
  const status = saved>=g.target ? "done" : !g.targetDate ? "open" : monthsLeft<=0 ? "late" : avgMo>=need*0.95 ? "on" : "behind";
  return {saved,left,pct,monthsLeft,need,avgMo,status};
}
const goalsInScope=()=>D.goals.filter(g=>!g.archived && (scope==="Household" || g.owner===scope || g.owner==="Both"));

/* Cards: live balance = starting balance + logged charges (+) and payments (−) */
function cardsFor(ps=PS()){
  const ctx=D.transactions.filter(t=>t.category==="Credit Card");
  return D.cards.filter(c=>ps.includes(c.person)).map(c=>{
    const live=c.balance+sum(ctx.filter(t=>t.person===c.person&&t.sub===c.name).map(t=>t.amount));
    return {...c,live,util:c.limit>0?live/c.limit*100:0};
  });
}

/* ======================================================================
   BILLS & LOANS
   A bill belongs to Household or one person; each scope shows only its own.
   Loan payments show up as bills on the loan's due day.
   ====================================================================== */
const ymdS=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDaysS=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymdS(d);};
function addMonthsKeepDay(s,n,day){ const [y,m,d]=s.split("-").map(Number), t=new Date(y,m-1+n,1), last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return ymdS(new Date(t.getFullYear(),t.getMonth(),Math.min(day||d,last))); }
/* All due dates of a bill between from and to (inclusive). Monthly bills on the 29th–31st fall on the month's last day when needed. */
function occurrences(b,from,to){
  const out=[], st=b.start; if(!/^\d{4}-\d{2}-\d{2}$/.test(st||"")) return out;
  if(b.frequency==="One-time"){ if(st>=from&&st<=to) out.push(st); return out; }
  const months={Monthly:1,Quarterly:3,Yearly:12}[b.frequency], days={Weekly:7,Biweekly:14}[b.frequency];
  for(let i=0;i<800;i++){ const d=months?addMonthsKeepDay(st,i*months):addDaysS(st,i*days); if(d>to) break; if(d>=from) out.push(d); }
  return out;
}
const scopeOwner=()=>scope;   // Household → Household bills; a person → that person's bills
function liveLoan(l){
  let bal=l.balance, last=l.asOf||l.start||D.today;
  D.loanPayments.filter(p=>p.loanId===l.id&&p.date>=last).sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
    const days=Math.max(0,daysBetween(last,p.date)); bal+=bal*l.apr/100*days/365; bal=Math.max(0,bal-p.amount); last=p.date; });
  return {live:bal,last};
}
function amortize(bal,apr,pay){ const r=apr/1200; let n=0,interest=0; if(bal<=0.005) return {n:0,interest:0,never:false};
  if(pay<=bal*r+0.005) return {n:Infinity,interest:Infinity,never:true};
  while(bal>0.005&&n<1200){ const i=bal*r; interest+=i; bal=bal+i-pay; n++; } return {n,interest,never:false}; }
function loanDues(l,from,to){ const st=(l.asOf||l.start||D.today).slice(0,8)+"01"; const out=[];
  for(let i=0;i<240;i++){ const d=addMonthsKeepDay(st,i,l.dueDay); if(d>to) break; if(d>=from&&d>(l.asOf||"")) out.push(d); } return out; }
function loanPaidFor(l,due){ return D.loanPayments.find(p=>p.loanId===l.id&&(p.note==="due:"+due||(!/^due:/.test(p.note||"")&&p.date>=addDaysS(due,-20)&&p.date<=addDaysS(due,10)))); }
/* Every bill/loan payment for the current scope from `from` to `to`, with paid status. */
function dueEntries(from,to){
  const out=[], t=D.today;
  const n=Math.max(1,D.people.length);
  D.bills.filter(b=>b.owner===scopeOwner()||(scope!=="Household"&&b.owner==="Household"&&b.split)).forEach(b=>occurrences(b,from,to).forEach(due=>{
    const paid=D.billPaid.find(p=>p.billId===b.id&&p.due===due)||null, share=b.owner==="Household"&&scope!=="Household";
    out.push({type:"bill",id:b.id,rec:b,name:b.name,amount:share?Math.round(b.amount/n*100)/100:b.amount,full:b.amount,share,split:b.split,due,paid,
      paidAmt:paid?(share?Math.round(paid.amount/n*100)/100:paid.amount):0,auto:b.autopay&&due<=t&&!paid,autopay:b.autopay,card:b.category==="Credit Card"});
  }));
  if(scope!=="Household") D.loans.filter(l=>l.person===scope&&liveLoan(l).live>0.005).forEach(l=>loanDues(l,from,to).forEach(due=>{
    const paid=loanPaidFor(l,due)||null; out.push({type:"loan",id:l.id,rec:l,name:l.name,amount:l.payment,full:l.payment,due,paid,paidAmt:paid?paid.amount:0,loan:true}); }));
  return out.sort((a,b)=>a.due.localeCompare(b.due)||a.name.localeCompare(b.name));
}
function billBuckets(){
  const t=D.today, e=dueEntries(addDaysS(t,-60),addDaysS(t,45));
  const late=e.filter(x=>!x.paid&&!x.auto&&x.due<t), week=e.filter(x=>!x.paid&&x.due>=t&&x.due<=addDaysS(t,7)), later=e.filter(x=>!x.paid&&x.due>addDaysS(t,7));
  const paid=e.filter(x=>(x.paid||x.auto)&&x.due>=addDaysS(t,-35)).sort((a,b)=>b.due.localeCompare(a.due));   // autopay bills count as paid on their due date
  return {late,week,later,paid,month:e.filter(x=>!x.paid&&x.due>=t&&x.due<=addDaysS(t,30))};
}

/* Payoff simulation. Minimum each month ≈ max($25, 1% of balance + that month's interest). */
function minPay(bal,apr){ if(bal<=0) return 0; const i=bal*apr/1200; return Math.min(bal+i, Math.max(25, bal*0.01+i)); }
function simulate(cards, monthly, strategy, minimumsOnly){
  let bals=cards.map(c=>Math.max(0,c.live)); const n=cards.length, payoff=Array(n).fill(null), series=[sum(bals)];
  let month=0, interest=0, short=false;
  while(bals.some(b=>b>0.005) && month<600){
    month++;
    const mins=bals.map((b,i)=>minPay(b,cards[i].apr));
    bals=bals.map((b,i)=>{ if(b<=0) return 0; const it=b*cards[i].apr/1200; interest+=it; return b+it; });
    let pay=minimumsOnly?sum(mins):monthly;
    if(pay<sum(mins)-0.005) short=true;
    bals=bals.map((b,i)=>{ const m=Math.min(b,mins[i],Math.max(0,pay)); pay-=m; return b-m; });
    const order=bals.map((b,i)=>i).filter(i=>bals[i]>0.005).sort((a,b)=> strategy==="snowball" ? bals[a]-bals[b] || cards[b].apr-cards[a].apr : cards[b].apr-cards[a].apr || bals[a]-bals[b]);
    for(const i of order){ if(pay<=0) break; const x=Math.min(pay,bals[i]); bals[i]-=x; pay-=x; }
    bals.forEach((b,i)=>{ if(b<=0.005 && payoff[i]===null){ payoff[i]=month; bals[i]=0; } });
    series.push(sum(bals));
  }
  return {months:month, interest, payoff, series, short};
}

/* Insights for the current scope */
function insights(){
  const out=[], p=pace(), ob=overallBudget(), k=p.k, prevK=addMonths(k,-1), mn=mname(k);
  const add=(tone,title,sub,go,goLabel)=>out.push({tone,title,sub,go,goLabel});
  if(ob.any && ob.missing.length===0){
    if(p.mtd>ob.total) add("bad",`Over the ${mn} budget by ${money0(p.mtd-ob.total)}`,`${money0(p.mtd)} spent of ${money0(ob.total)} with ${p.left} day${p.left===1?"":"s"} left.`,"activity","See spending");
    else if(p.forecast!=null && p.forecast>ob.total*1.02) add("warn",`On pace for ${money0(p.forecast)} this month`,`About ${money0(p.forecast-ob.total)} over your ${money0(ob.total)} budget. Keeping to ${money0(Math.max(0,(ob.total-p.mtd)/Math.max(1,p.left)))}/day from here stays on budget.`,"activity","See spending");
    else if(p.forecast!=null) add("good",`On track to finish ${money0(ob.total-p.forecast)} under budget`,`Forecast ${money0(p.forecast)} of ${money0(ob.total)}.`);
  } else if(!ob.any){ add("info",`No ${mn} budget yet`,`Set one to get pace alerts and a month-end forecast.`,"budget","Set budget"); }
  if(p.prevSame>0){ const d=p.mtd-p.prevSame, pct=d/p.prevSame*100;
    if(Math.abs(d)>=50 && Math.abs(pct)>=10) add(d>0?"warn":"good", d>0?`${money0(d)} more than this point in ${mname(prevK)}`:`${money0(-d)} less than this point in ${mname(prevK)}`, `${money0(p.mtd)} by day ${p.day} vs ${money0(p.prevSame)} last month (${pct>0?"+":""}${pct.toFixed(0)}%).`); }
  catBudgetRows().forEach(b=>{ const sp=catSpent(b.category); const st=catStatus(sp,b.budget,p);
    if(sp>b.budget) add("bad",`${b.category} is over budget`,`${money0(sp)} of ${money0(b.budget)}, ${money0(sp-b.budget)} over.`,"plan","Budgets");
    else if(st==="warn") add("warn",`${b.category}: ${Math.round(sp/b.budget*100)}% used`,`${money0(b.budget-sp)} left for ${p.left} more day${p.left===1?"":"s"}.`,"plan","Budgets"); });
  const sp=spendOf(), cur={}, prev={};
  upToDay(sp,k,p.day).forEach(t=>cur[t.sub]=(cur[t.sub]||0)+t.amount);
  upToDay(sp,prevK,Math.min(p.day,dim(prevK))).forEach(t=>prev[t.sub]=(prev[t.sub]||0)+t.amount);
  const jumps=Object.keys(cur).map(c=>({c,d:cur[c]-(prev[c]||0)})).filter(x=>x.d>=75).sort((a,b)=>b.d-a.d);
  if(jumps[0]) add("info",`${jumps[0].c} is up ${money0(jumps[0].d)}`,`${money0(cur[jumps[0].c])} so far vs ${money0(prev[jumps[0].c]||0)} by this point in ${mname(prevK)}.`,"activity:"+jumps[0].c,"View");
  const median=a=>{const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
  sp.filter(t=>daysBetween(t.date,D.today)<=14 && daysBetween(t.date,D.today)>=0 && t.amount>=40).forEach(t=>{
    const hist=sp.filter(x=>x.sub===t.sub && x.row!==t.row && x.date<t.date && daysBetween(x.date,t.date)<=183).map(x=>x.amount);
    if(hist.length>=3){ const md=median(hist); if(t.amount>=md*2.5) add("info",`Unusual ${t.sub} charge: ${money0(t.amount)}`,`“${t.desc}” on ${dayLabel(t.date)}. ${t.sub} is usually about ${money0(md)}.`,"txn:"+t.row,"Open"); }
  });
  goalsInScope().forEach(g=>{ const gi=goalInfo(g);
    if(gi.status==="behind") add("warn",`${g.name} needs ${money0(gi.need)}/month`,`To reach ${money0(g.target)} by ${mlabel(mkey(g.targetDate))}. Recent pace: ${money0(gi.avgMo)}/month.`,"goals","Goals");
    else if(gi.status==="done") add("good",`${g.name} is fully funded`,`${money0(gi.saved)} saved of ${money0(g.target)}.`,"goals","Goals"); });
  { const bb=billBuckets();
    if(bb.late.length) add("bad",`${bb.late.length} bill${bb.late.length>1?"s":""} past due`,bb.late.slice(0,3).map(x=>`${x.name} ${money0(x.amount)}`).join(" · "),"dates","Dates");
    const soon=bb.week.filter(x=>daysBetween(D.today,x.due)<=3);
    if(soon.length) add("warn",soon.length===1?`${soon[0].name} is due ${daysBetween(D.today,soon[0].due)===0?"today":daysBetween(D.today,soon[0].due)===1?"tomorrow":"in "+daysBetween(D.today,soon[0].due)+" days"}`:`${soon.length} bills due in the next 3 days`,`${money0(sum(soon.map(x=>x.amount)))} total${soon.every(x=>x.autopay)?" · on autopay":""}`,"dates","Dates"); }
  cardsFor().filter(c=>c.util>30).forEach(c=>add(c.util>50?"bad":"warn",`${c.name} is at ${c.util.toFixed(0)}% utilization`,`Paying ${money0(c.live-c.limit*0.3)} would bring it to 30%.`,"cards","Cards"));
  if(p.inc>0){ const rate=(p.inc-p.mtd)/p.inc*100; if(rate>=20) add("good",`Keeping ${rate.toFixed(0)}% of ${mn}'s income so far`,`${money0(p.inc)} in, ${money0(p.mtd)} spent.`); }
  const rank={bad:0,warn:1,info:2,good:3}; return out.sort((a,b)=>rank[a.tone]-rank[b.tone]);
}

/* Frequent purchases for one-tap repeats */
function frequent(){
  const m={}; spendOf().filter(t=>daysBetween(t.date,D.today)<=150).forEach(t=>{
    const key=[t.person,String(t.desc).toLowerCase(),t.sub,t.category,t.method].join("|");
    (m[key]=m[key]||{n:0,last:null}).n++; if(!m[key].last||t.date>=m[key].last.date) m[key].last=t; });
  return Object.values(m).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n||b.last.date.localeCompare(a.last.date)).slice(0,8).map(x=>x.last);
}

/* ======================================================================
   CHARTS (SVG, no library)
   ====================================================================== */
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const SERIES=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
function catColor(cat){ const order=[...D.categories]; let i=order.indexOf(cat);
  if(i<0) i=order.length+uniqSorted(D.transactions.map(t=>t.category)).filter(c=>!order.includes(c)&&c!=="Credit Card").indexOf(cat);
  return cssv(SERIES[Math.max(0,i)%SERIES.length]); }
function legend(items){return `<div class="legend">${items.map(([l,c,dash])=>`<span><i class="${dash?"dash":""}" style="${dash?`border-color:${c}`:`background:${c}`}"></i>${esc(l)}</span>`).join("")}</div>`;}
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect(),pad=12;let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-pad)x=e.clientX-r.width-14;if(y+r.height>innerHeight-pad)y=e.clientY-r.height-14;tip.style.left=Math.max(pad,x)+"px";tip.style.top=Math.max(pad,y)+"px";}
function hideTip(){tip.hidden=true;}
document.addEventListener("scroll",hideTip,{passive:true});
const tipRow=(c,l,v)=>`<div><span><i style="background:${c}"></i>${esc(l)}</span><span class="money">${v}</span></div>`;
function niceTicks(max,n=4){if(!(max>0))return{ticks:[0,1],top:1};const raw=max/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);const top=Math.ceil(max/step)*step,ticks=[];for(let v=0;v<=top+1e-9;v+=step)ticks.push(+v.toFixed(6));return{ticks,top};}
const shortMoney=v=>{const a=Math.abs(v);return(v<0?"−":"")+"$"+(a>=1e6?(a/1e6).toFixed(a%1e6?1:0)+"M":a>=1e3?(a/1e3).toFixed(a%1e3?1:0)+"k":Math.round(a));};
const NS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);if(parent)parent.appendChild(el);return el;}
function newSvg(box){box.innerHTML="";const w=Math.max(200,box.clientWidth),h=box.clientHeight;const svg=svgEl("svg",{viewBox:`0 0 ${w} ${h}`,width:w,height:h});box.appendChild(svg);return{svg,w,h};}
function roundRect(x,y,w,h,r,c){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);const k=q=>c[q]?r:0;return`M${x+k("tl")},${y} H${x+w-k("tr")} Q${x+w},${y} ${x+w},${y+k("tr")} V${y+h-k("br")} Q${x+w},${y+h} ${x+w-k("br")},${y+h} H${x+k("bl")} Q${x},${y+h} ${x},${y+h-k("bl")} V${y+k("tl")} Q${x},${y} ${x+k("tl")},${y} Z`;}
const Viz={
  donut(box,items){
    const{svg,w,h}=newSvg(box),tot=sum(items.map(i=>i.value));if(!tot)return;
    const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,r=R*.62,surf=cssv("--surface");let a0=-Math.PI/2;
    items.forEach(it=>{const a1=a0+it.value/tot*Math.PI*2,large=(a1-a0)>Math.PI?1:0,p=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];let d;
      if(items.length===1)d=`M${cx-R},${cy} A${R},${R} 0 1 1 ${cx+R},${cy} A${R},${R} 0 1 1 ${cx-R},${cy} M${cx-r},${cy} A${r},${r} 0 1 0 ${cx+r},${cy} A${r},${r} 0 1 0 ${cx-r},${cy}Z`;
      else{const[x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);d=`M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z`;}

    const m={l:Math.max(34,fmt(nt.top).length*7+10),r:10,t:12,b:26},pw=w-m.l-m.r,ph=h-m.t-m.b;

    if(opt.kind==="bars"){

        else{const k=series.length,sw=(bw-2*(k-1))/k;series.forEach((s,j)=>{const v=s.data[i]||0;if(v<=0)return;const x0=xc(i)-bw/2+j*(sw+2);svgEl("path",{d:roundRect(x0,y(v),sw,Math.max(1,y(0)-y(v)),4,{tl:1,tr:1}),fill:s.color},svg);});}

    const cross=svgEl("line",{y1:m.t,y2:m.t+ph,stroke:cssv("--muted"),"stroke-width":1,opacity:0},svg);
    const hit=svgEl("rect",{x:m.l,y:m.t,width:pw,height:ph,class:"hit"},svg);
    hit.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*(w/r.width),i=Math.max(0,Math.min(n-1,Math.floor((sx-m.l)/band)));

  hbars(box,labels,series){

    const lw=Math.min(150,Math.max(...labels.map(l=>l.length))*7+12),m={l:lw,r:56,t:6,b:22},pw=w-m.l-m.r,ph=h-m.t-m.b,band=ph/n,bh=Math.min(24,band*.62);

      segs.forEach((g,j)=>{const end=j===segs.length-1,x0=x(base)+(j>0?2:0),wd=Math.max(1,x(base+g.v)-x0);svgEl("path",{d:roundRect(x0,yc-bh/2,wd,bh,4,{tr:end,br:end}),fill:g.s.color},svg);base+=g.v;});

function cashFlowHTML(){

  later(()=>{ const el=$("#hFlow"); if(el) Viz.xy(el,keys.map(mlabel),[{name:"Income",color:cssv("--s1"),data:keys.map(k=>inc[k]||0)},{name:"Spending",color:cssv("--s2"),data:keys.map(k=>sp[k]||0)}],{kind:"bars"}); });
  return `<section class="panel"><div class="ph"><h3>Cash flow</h3><span class="muted">${esc(scope)} · last ${keys.length} month${keys.length>1?"s":""}</span></div>

    <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Month</th><th class="r">Income</th><th class="r">Spending</th><th class="r">Cash left</th><th class="r">Kept</th><th class="r">Set aside</th></tr></thead><tbody>
    ${keys.slice().reverse().map(k=>{const i=inc[k]||0,s=sp[k]||0;return `<tr><td>${mlabel(k)}</td><td class="r money">${money0(i)}</td><td class="r money">${money0(s)}</td><td class="r money ${i-s<0?"up":""}">${money0(i-s)}</td><td class="r num">${i?((i-s)/i*100).toFixed(0)+"%":"—"}</td><td class="r money">${money0(sv[k]||0)}</td></tr>`;}).join("")}

function breakdownHTML(){
  const m={}; D.transactions.filter(t=>inScope(t.person)&&(isSpend(t)||t.category==="Credit Card")).forEach(t=>{const c=t.category||"Other",d=(t.category==="Credit Card"&&t.amount<0)?"Payment":"Charge";m[c]=m[c]||{Charge:0,Payment:0};m[c][d]+=Math.abs(t.amount);});
  const cats=Object.keys(m).sort((a,b)=>(m[b].Charge+m[b].Payment)-(m[a].Charge+m[a].Payment));
  if(!cats.length) return `<section class="panel"><div class="ph"><h3>Category breakdown</h3></div><div class="empty">No transactions yet.</div></section>`;
  const hasPay=cats.some(c=>m[c].Payment>0);
  later(()=>{ const el=$("#hBreak"); if(!el) return; const s=[{name:"Charges",color:cssv("--s2"),data:cats.map(c=>m[c].Charge)}]; if(hasPay) s.push({name:"Card payments",color:cssv("--s3"),data:cats.map(c=>m[c].Payment)}); Viz.hbars(el,cats,s); });

}

/* Bills paid (by hand or autopay) and loan payments, for the scope you're looking at.
   A person sees their own bills, their half of split household bills, and household bills paid from their account. */
function billPayRows(){
  const n=Math.max(1,D.people.length);
  return D.billPaid.map(p=>{ const b=D.bills.find(x=>x.id===p.billId); if(!b) return null;
    let amount=p.amount, share=false;
    if(scope!=="Household"){
      if(b.owner===scope) {}
      else if(b.owner==="Household"&&b.split){ amount=Math.round(p.amount/n*100)/100; share=true; }
      else if(b.owner==="Household"&&p.person===scope) {}
      else return null;
    }
    return { kind:"bill", date:String(p.date||p.due), due:p.due, name:b.name, billId:b.id, owner:b.owner, person:p.person, how:p.how||"", amount, full:p.amount, share, split:b.split, autopay:b.autopay, sub:b.sub };
  }).filter(Boolean);
}
function loanPayRows(){
  return D.loanPayments.map(p=>{ const l=D.loans.find(x=>x.id===p.loanId); if(!l||!inScope(l.person)) return null;
    return { kind:"loan", date:p.date, name:l.name, loanId:l.id, person:p.person, amount:p.amount, note:p.note, loanKind:l.kind }; }).filter(Boolean);
}
function activityRows(noMonth){
  const a=ui.act, q=a.q.trim().toLowerCase();

/* ---------------- DEBT (cards + loans) ---------------- */
function debtHTML(){
  const tabs=`<div class="seg" role="group" aria-label="Debt"><button data-debt="cards" aria-pressed="${ui.debt!=="loans"}">Credit cards</button><button data-debt="loans" aria-pressed="${ui.debt==="loans"}">Loans</button></div>`;
  return tabs+(ui.debt==="loans"?loansHTML():cardsHTML());
}
function loanInfo(l){ const {live,last}=liveLoan(l), am=amortize(live,l.apr,l.payment), next=loanDues(l,D.today,addDaysS(D.today,62)).find(d=>!loanPaidFor(l,d));
  return {live,last,am,next,paidPct:l.original>0?Math.max(0,Math.min(100,(1-live/l.original)*100)):0}; }
function loansHTML(){
  const ls=D.loans.filter(l=>inScope(l.person));
  const add=`<button class="btn primary sm" data-add="loan">Add a loan</button>`;
  if(!ls.length) return `<section class="panel"><div class="empty">No loans on file for ${esc(scope)} yet. Add a car loan to track its balance, payoff date and interest.</div><div style="margin-top:12px">${add}</div></section>`;
  const tot=sum(ls.map(l=>liveLoan(l).live)), monthly=sum(ls.map(l=>l.payment));
  if(!ui.lsim||!ls.some(l=>l.id===ui.lsim.id)) ui.lsim={id:ls[0].id,extra:100};
  const cards=ls.map(l=>{ const i=loanInfo(l), nd=i.next?parseD(i.next):null;
    return `<article class="loan"><div class="nm"><span>${esc(l.name)}</span><button class="lbtn" data-edit-loan="${esc(l.id)}">Edit</button></div>
      <div class="who">${esc(l.kind)} loan${l.lender?` · ${esc(l.lender)}`:""}${scope==="Household"?` · ${esc(l.person)}`:""}</div>
      <div><div class="who">Balance (after the last logged payment)</div><div class="bal">${money(i.live)}</div></div>
      <div class="track" role="progressbar" aria-label="Paid off" aria-valuenow="${Math.round(i.paidPct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${i.paidPct}%"></i></div>
      <div class="grid"><div>Paid off<b>${i.paidPct.toFixed(0)}% of ${money0(l.original)}</b></div><div>Payment<b>${money0(l.payment)}/mo</b></div>
        <div>Next due<b>${nd?`${MON[nd.getMonth()]} ${nd.getDate()}`:"—"}</b></div><div>APR<b>${(+l.apr).toFixed(2)}%</b></div>
        <div>Paid off by<b>${i.am.never?"Never at this payment":i.am.n===0?"Paid off":mlabel(addMonths(curK(),i.am.n))}</b></div><div>Interest left<b>${i.am.never?"—":money0(i.am.interest)}</b></div></div>
      <div class="acts"><button class="hbtn" data-add="loanpay" data-loan="${esc(l.id)}">Log payment</button><button class="hbtn" data-setbal="loan:${esc(l.id)}">Update balance</button></div></article>`; }).join("");
  const sl=ls.find(l=>l.id===ui.lsim.id);
  return `<section class="panel"><div class="ph"><h3>Your loans</h3><span class="muted">${money0(tot)} owed · ${money0(monthly)}/month</span></div><div class="cardgrid">${cards}</div><div style="margin-top:14px">${add}</div></section>
  <section class="panel"><div class="ph"><h3>Pay it off faster</h3><span class="muted">extra each month</span></div><div class="sim">
    <div style="display:flex;flex-direction:column;gap:10px">
      <label class="f">Loan<select id="lsimLoan">${ls.map(l=>`<option value="${esc(l.id)}" ${l.id===sl.id?"selected":""}>${esc(l.name)}</option>`).join("")}</select></label>
      <label class="f">Extra per month ($)<input id="lsimExtra" type="number" inputmode="decimal" min="0" step="25" value="${ui.lsim.extra}"></label>
    </div><div class="stats" id="lsimOut" style="align-content:start">${lsimOut(sl)}</div></div></section>
  ${(()=>{ const ps=D.loanPayments.filter(p=>ls.some(l=>l.id===p.loanId)).sort((a,b)=>b.date.localeCompare(a.date)||b.row-a.row).slice(0,12);
    return ps.length?`<section class="panel"><div class="ph"><h3>Recent loan payments</h3></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Loan</th><th class="r">Amount</th><th>By</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td class="num">${esc(p.date)}</td><td>${esc((D.loans.find(l=>l.id===p.loanId)||{}).name||"")}</td><td class="r money">${money(p.amount)}</td><td>${esc(p.person)}</td><td><button class="link" data-unpay="loan:${p.row}">Delete</button></td></tr>`).join("")}</tbody></table></div><p class="hint" style="margin-top:8px">Deleting a payment here doesn't remove its spending entry in Activity.</p></section>`:""; })()}`;
}
function lsimOut(l){ if(!l) return ""; const {live}=liveLoan(l), base=amortize(live,l.apr,l.payment), fast=amortize(live,l.apr,l.payment+(+ui.lsim.extra||0));
  if(base.never) return `<div class="stat"><div class="k">Heads up</div><div class="d">The payment doesn't cover the monthly interest. Check the payment and APR.</div></div>`;
  return `<div class="stat"><div class="k">Paid off by</div><div class="v" style="font-family:var(--f-body)">${mlabel(addMonths(curK(),fast.n))}</div><div class="d">instead of ${mlabel(addMonths(curK(),base.n))}</div></div>
    <div class="stat"><div class="k">Sooner by</div><div class="v down">${base.n-fast.n} mo</div></div>
    <div class="stat"><div class="k">Interest saved</div><div class="v down">${money0(Math.max(0,base.interest-fast.interest))}</div><div class="d">${money0(fast.interest)} left instead of ${money0(base.interest)}</div></div>`; }

/* ---------------- CARDS ---------------- */
function cardsHTML(){
  const cs=cardsFor(), ctx=D.transactions.filter(t=>t.category==="Credit Card"&&inScope(t.person));
  const actions=`<div class="row"><button class="btn primary sm" data-add="cc" ${cs.length?"":"disabled"}>Log charge or payment</button><button class="btn sm" data-add="card">Add a card</button></div>`;
  if(!cs.length) return `<section class="panel"><div class="empty">No credit cards on file for ${esc(scope)} yet.</div><div style="margin-top:12px">${actions}</div></section>`;
  const tot=sum(cs.map(c=>c.live)), lim=sum(cs.map(c=>c.limit));
  if(!ui.sim||!cs.some(c=>c.row===ui.sim.row)) ui.sim={row:cs[0].row,pay:0,months:1};
  const sim=ui.sim;
  later(()=>{ const u=$("#ccUtil"); if(u) Viz.xy(u,cs.map(c=>c.name),[{name:"Utilization",color:cssv("--s1"),data:cs.map(c=>Math.max(0,+c.util.toFixed(1)))}],{kind:"bars",stacked:true,ref:30,refLabel:"30%",minTop:40,fmt:v=>Math.round(v)+"%",tipFmt:v=>v.toFixed(1)+"%",maxBar:56});
    const pc=$("#ccPC"); if(pc&&ctx.length){ const keys=uniqSorted(ctx.map(t=>mkey(t.date))).slice(-12);
      Viz.xy(pc,keys.map(mlabel),[{name:"Charges",color:cssv("--s2"),data:keys.map(k=>sum(ctx.filter(t=>mkey(t.date)===k&&t.amount>=0).map(t=>t.amount)))},{name:"Payments",color:cssv("--s3"),data:keys.map(k=>sum(ctx.filter(t=>mkey(t.date)===k&&t.amount<0).map(t=>-t.amount)))}],{kind:"bars",stacked:true}); }
    simUpdate(); });
  return `<section class="panel"><div class="ph"><h3>Your cards</h3><span class="muted">${money0(tot)} of ${money0(lim)} · ${lim?(tot/lim*100).toFixed(1):0}% overall</span></div>
    <div class="cardgrid">${cs.map(c=>{const st=c.util>50?"bad":c.util>30?"warn":"";return `<div class="ccard"><div class="nm"><span>${esc(c.name)}</span><span class="nmb"><button class="edit" data-setbal="card:${c.row}">Update balance</button><button class="edit" data-edit-card="${c.row}" aria-label="Edit ${esc(c.name)}">Edit</button></span></div>${scope==="Household"?`<div class="who">${esc(c.person)}</div>`:""}
      <div><div class="who">Live balance</div><div class="bal">${money(c.live)}</div></div><div class="track ${st}"><i style="width:${Math.max(0,Math.min(100,c.util))}%"></i></div>
      <div class="ft"><span>${c.util.toFixed(1)}% used</span><span>Limit <b>${money0(c.limit)}</b></span><span>APR <b>${(+c.apr).toFixed(2)}%</b></span></div></div>`;}).join("")}</div>
    <div style="margin-top:14px">${actions}</div></section>
  <div class="cols"><section class="panel"><div class="ph"><h3>Utilization by card</h3><span class="muted">30% line marked</span></div>${chartBox("ccUtil","Utilization by card")}</section>
    <section class="panel"><div class="ph"><h3>Payments vs charges</h3><span class="muted">by month</span></div>${ctx.length?legend([["Charges",cssv("--s2")],["Payments",cssv("--s3")]])+chartBox("ccPC","Payments and charges by month"):`<div class="empty">No card charges or payments logged yet.</div>`}</section></div>
  <section class="panel"><div class="ph"><h3>Payment impact simulator</h3><button class="link" data-goto="plan:payoff">Full payoff plan</button></div><div class="sim">
    <div style="display:flex;flex-direction:column;gap:10px">
      <label class="f">Card<select id="simCard">${cs.map(c=>`<option value="${c.row}" ${c.row===sim.row?"selected":""}>${esc(c.name)}${scope==="Household"?` (${esc(c.person)})`:""}</option>`).join("")}</select></label>
      <label class="f">Payment amount ($)<input id="simPay" type="number" inputmode="decimal" min="0" step="50" value="${sim.pay||""}" placeholder="0"></label>
      <label class="f">Months ahead: <span id="simMoLbl" class="num">${sim.months}</span><input id="simMo" type="range" min="1" max="12" value="${sim.months}"></label>
    </div><div class="stats" id="simOut" style="align-content:start"></div></div></section>`;
}
function simUpdate(){
  const c=ui.sim&&cardsFor().find(x=>x.row===ui.sim.row), el=$("#simOut"); if(!c||!el) return;
  const rate=(+c.apr||0)/1200, nb=c.live-(+ui.sim.pay||0), interest=nb*rate*ui.sim.months, proj=nb+interest;
  el.innerHTML=`<div class="stat"><div class="k">Current balance</div><div class="v">${money0(c.live)}</div></div><div class="stat"><div class="k">New balance</div><div class="v">${money0(nb)}</div></div>
    <div class="stat"><div class="k">Interest added</div><div class="v ${interest>0?"up":""}">${money0(interest)}</div><div class="d">${ui.sim.months} month${ui.sim.months>1?"s":""} at ${(+c.apr).toFixed(2)}% APR</div></div>
    <div class="stat"><div class="k">Projected balance</div><div class="v">${money0(proj)}</div></div>`;
}

const me=()=>{ if(linkMe && D.people.includes(linkMe)) return linkMe; const m=store.get("ff_me"); return D.people.includes(m)?m:D.people[0]; };
const defPerson=()=>scope!=="Household"?scope:me();
const other=p=>D.people.find(x=>x!==p);
function openSheet(kind,o={}){
  S={kind,mode:o.rec?"edit":"add",rec:o.rec||null,vals:Object.assign({},o.vals||{}),err:"",confirmDel:false};
  $("#scrim").hidden=false; renderSheet();
  setTimeout(()=>{ const a=$("#sheet [data-k=amount]")||$("#sheet [data-k=name]"); if(a && S && S.mode==="add") a.focus(); },40);

const fSel=(k,label,list,val,cls="")=>`<label class="f ${cls}">${label}<select data-k="${k}">${list.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${x[0]===val?"selected":""}>${esc(x[1])}</option>`:`<option ${x===val?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;

const segK=(k,list,val,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${list.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return `<button type="button" data-segk="${k}" data-segv="${esc(v)}" aria-pressed="${v===val}">${esc(l)}</button>`;}).join("")}</div>`;
const amtBig=(val,label="Amount")=>`<div class="amtbig"><span>$</span><input data-k="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(val??"")}" aria-label="${esc(label)}"></div>`;

const ADD_KINDS=[["txn","Spending"],["cc","Card"],["loanpay","Loan"],["pay","Pay"],["bill","Bill"],["goalmove","Goal"],["budget","Budget"]];
function renderSheet(){

      ${fSel("method","Payment method",D.paymentMethods,v.method,"full")}</div>
      <datalist id="descList">${uniqSorted(D.transactions.filter(t=>t.category!=="Credit Card").map(t=>t.desc)).slice(0,400).map(d=>`<option value="${esc(d)}">`).join("")}</datalist>
      ${!ed&&v.type==="Expense"?`<div class="splitbox"><label class="cb"><input type="checkbox" data-k="split" ${v.split?"checked":""}> Split with ${esc(other(v.person))}</label>
        ${v.split?`<label class="f">${esc(other(v.person))}'s share: <span class="num">${v.share}%</span><input type="range" data-k="share" min="5" max="95" step="5" value="${v.share}"></label>
        <div class="hint">${esc(v.person)} <b class="money">${money(mine)}</b> · ${esc(other(v.person))} <b class="money">${money(theirs)}</b>. Saved as two entries.</div>`:""}</div>`:""}
      ${amt>0?`<div class="summary">${esc(v.person)} · <b>${esc(v.type)}</b> · <b class="money">${money(amt)}</b> · ${esc(v.sub)} · ${esc(dayLabel(v.date))}${v.split&&!ed&&v.type==="Expense"?` · split ${100-v.share}/${v.share}`:""}</div>`:""}`;
