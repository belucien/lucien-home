<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shim.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucien Family Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — header + who chip, one view at a time (Home, Lists, Dates, Done),
   bottom tab bar on phones (top bar on desktop) with a raised Add button. Add/edit open as sheets. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F5F7FA; --fg:#141C27; --muted:#59667A; --line:#D8DEE6; --line2:#E7EBF0;
  --accent:#2F3E8F; --accent-fg:#FFFFFF; --accent-soft:#E2E6F6;
  --hero:#18213A; --hero-fg:#F2F4FA; --hero-muted:#A9B2CC; --hero-line:#2C3758; --hero-accent:#F3C969;
  --c0:#3B4F9E; --c1:#2F7D5B; --c2:#C0332B; --c3:#946200; --c4:#A3346B; --c5:#1F6F82;
  --t0:#E4E8F6; --t1:#E0F0E8; --t2:#F8E3E1; --t3:#F6EDD6; --t4:#F6E2EC; --t5:#DDF0F4;
  --p0:#7A4BB5; --p1:#C46A16;
  --good:#1E7B45; --bad:#B42318;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media all{:root{
  --bg:#0E131A; --surface:#161D27; --sunk:#121821; --fg:#E7ECF2; --muted:#98A4B5; --line:#283241; --line2:#1F2834;
  --accent:#9AA8F0; --accent-fg:#10151F; --accent-soft:#1F2747;
  --hero:#1C2747; --hero-fg:#F2F4FA; --hero-muted:#AAB4D2; --hero-line:#33406A; --hero-accent:#F3C969;
  --c0:#8E9EEA; --c1:#6CC79C; --c2:#F07A70; --c3:#E2B44F; --c4:#EB8DBA; --c5:#6CC4D6;
  --t0:#1F2645; --t1:#16352A; --t2:#3E1D1B; --t3:#3A2E12; --t4:#3D1C2C; --t5:#14343B;
  --p0:#B791E8; --p1:#F0A35C;
  --good:#5DC489; --bad:#F07A70; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.money,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.shell{max-width:980px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.top h1{font-size:clamp(1.15rem,5vw,1.4rem);font-weight:800;line-height:1.1}
.iconbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn:hover{color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.whochip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:.9rem}
.whochip button{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.84rem;margin-left:4px}
.asof{font-size:.8rem;color:var(--muted)}

nav.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 24px));display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
nav.tabs button{all:unset;cursor:pointer;flex:1;min-width:0;text-align:center;padding:6px 0;border-radius:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem}
nav.tabs button svg{width:22px;height:22px;display:block}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button.fab{flex:none;width:56px;height:56px;padding:0;border-radius:18px;margin:-26px 8px 0;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px rgba(0,0,0,.25)}
nav.tabs button.fab svg{width:26px;height:26px}
nav.tabs button.fab span{display:none}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
.shell{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))!important}
/* phones: docked edge to edge */
@media (max-width:700px){
  nav.tabs{left:0;right:0;transform:none;width:auto;bottom:0;border-radius:0;border-width:1px 0 0;box-shadow:none;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  nav.tabs button{font-size:.64rem;padding:5px 0}
  nav.tabs button svg{width:21px;height:21px}
  nav.tabs button.fab{width:52px;height:52px;margin:-22px 3px 0}
}

/* ---------- common ---------- */
.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:1.15rem;font-weight:700}
.ph .muted{font-size:.84rem}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.88rem}
.link:focus-visible{outline:2px solid var(--accent)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:.86rem;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:24px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.notice{padding:10px 14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.stat .v.money{font-family:var(--f-mono);font-size:1.2rem;font-weight:600}
.stat .d{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:first-child{grid-column:1/-1}}

/* hero countdown */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--hero-muted);font-weight:700}
.hero .nameline{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.hero .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big b{font-family:var(--f-display);font-weight:800;font-size:clamp(3.4rem,17vw,5.2rem);line-height:.9;letter-spacing:-.03em;color:var(--hero-accent)}
.hero .big span{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.hero .when{color:var(--hero-muted);font-size:.92rem}
.hero .next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hero-line);padding-top:12px}
.hero .next button{all:unset;cursor:pointer;min-width:0}
.hero .next .n{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.hero .next .l{font-size:.8rem;color:var(--hero-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .next button:focus-visible{outline:2px solid var(--hero-fg)}
/* small calendar tear-off mark in the hero corner */
.hero .cal{position:absolute;right:18px;top:18px;width:58px;border-radius:10px;overflow:hidden;background:var(--hero-fg);color:var(--hero);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hero .cal i{display:block;background:var(--hero-accent);color:var(--hero);font-style:normal;font-size:.66rem;font-weight:800;letter-spacing:.08em;padding:3px 0}
.hero .cal b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.5rem;padding:2px 0 4px}

/* list cards */
.listgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-width:0}
.lcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--cc)}
.lcard .nm{font-family:var(--f-display);font-weight:700;font-size:1.08rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .st{font-size:.84rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lcard:focus-visible{outline:2px solid var(--accent)}
.lcard.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.lcard.new::before{display:none}
.bar{height:8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--cc,var(--accent))}

/* countdown cards */
.cdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cd{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;min-width:0}
.cd:focus-visible{outline:2px solid var(--accent)}
.cd .days{grid-row:1/4;width:72px;height:72px;border-radius:14px;background:var(--tc);color:var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cd .days b{font-family:var(--f-display);font-weight:800;font-size:1.9rem}
.cd .days small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.cd .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .dt{font-size:.84rem;color:var(--muted)}
.cd .tag{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem}
.tagpill{font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tc);color:var(--cc);text-transform:capitalize}
.cd.now .days{background:var(--cc);color:var(--surface)}
.cd .prog{grid-column:2;font-size:.78rem;color:var(--muted)}
.k-party{--cc:var(--c4);--tc:var(--t4)} .k-concert{--cc:var(--c0);--tc:var(--t0)} .k-vacation{--cc:var(--c5);--tc:var(--t5)}
.k-birthday{--cc:var(--c3);--tc:var(--t3)} .k-appointment{--cc:var(--c1);--tc:var(--t1)} .k-other{--cc:var(--muted);--tc:var(--sunk)}
.k-holiday{--cc:var(--c2);--tc:var(--t2)} .k-baby{--cc:var(--c1);--tc:var(--t1)}
.hol{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px}
.hol label{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.hol input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.hol .d{color:var(--muted);font-size:.82rem;margin-left:auto}

/* lists view */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;font-size:.88rem;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--cc)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.dash{border-style:dashed}
.chip:focus-visible{outline:2px solid var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;flex:1 1 200px;max-width:360px;font-size:16px}
.tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;cursor:pointer;padding:4px 6px}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:600}
.btn.link:hover{color:var(--fg)}
.cat{display:flex;flex-direction:column;gap:10px}
.cat-h,.sec-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--cc);padding-bottom:6px}
.cat-h h2{font-size:1.25rem;color:var(--cc);font-weight:800}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:var(--sunk);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.cat-h:focus-visible,.sec-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hl{display:inline-flex;align-items:center;gap:8px}
.chev{display:inline-block;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s;margin-bottom:3px;flex:none}
[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.sec-h .bothnote{font-weight:500;text-transform:none;letter-spacing:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line2)}
.sec-h + .item{border-top:0}
.item .body{all:unset;cursor:pointer;min-width:0;display:block}
.item .body:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--surface)}
.chk:checked{background:var(--cc);border-color:var(--cc)}
.chk:checked::after{content:"";width:6px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.nm2{font-weight:600;overflow-wrap:anywhere}
.item.done .nm2{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);margin-top:2px}
.meta a{color:var(--cc)}
.olink{display:inline-flex;align-items:center;margin-top:6px;padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--cc);background:var(--tc);text-decoration:none}
.olink:focus-visible{outline:2px solid var(--accent)}
.pill{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;background:var(--tc);color:var(--cc)}
.pill.both{background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.wait{color:var(--fg)}
.price{text-align:right;font-size:.92rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.price small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted)}
.who{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;background:var(--muted);flex:none}
.who.p0{background:var(--p0)} .who.p1{background:var(--p1)}
@media all{.who{color:#10151B}}
.pair{display:flex;gap:4px}
.pp{width:28px;height:28px;border-radius:50%;border:2px solid var(--pc);background:var(--surface);color:var(--pc);font-weight:800;font-size:.72rem;cursor:pointer;display:grid;place-items:center;padding:0}
.pp.p0{--pc:var(--p0)} .pp.p1{--pc:var(--p1)}
.pp.on{background:var(--pc);color:var(--surface)}
.pp.mine{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--pc)}
/* manage lists */
.lists-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.lists-row:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:4px;background:var(--cc)}
.lists-row input{font-size:16px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%;min-width:0}
.lists-row .confirm{grid-column:1/-1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--t2);color:var(--c2);padding:10px 12px;border-radius:10px}

/* meals */
.weekbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.night{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line2)}
.night:first-child{border-top:0}
.night .dd{width:48px;text-align:center;line-height:1.05}
.night .dd b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.night .dd small{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.night.today .dd{background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:5px 0}
.night.today .dd small{color:var(--accent-fg)}
.night.past{opacity:.55}
.night .body{all:unset;cursor:pointer;min-width:0;display:block}
.night .body:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.night .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.night .nm.none{color:var(--muted);font-weight:500}
.night .acts .mini{width:32px;height:32px}
.night .acts{gap:3px}
.night .sub{font-size:.8rem;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.night .acts{display:flex;gap:4px}
.mini{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.mini svg{width:16px;height:16px}
.mini[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mini:focus-visible{outline:2px solid var(--accent)}
.tg{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tg.v{background:var(--t1);color:var(--c1);border-color:transparent}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.rcard:focus-visible{outline:2px solid var(--accent)}
.rcard .nm{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.rcard .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.rcard .mt{font-size:.8rem;color:var(--muted)}
.fav{color:var(--c3);font-weight:800}
.tonight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.tonight .ic{width:46px;height:46px;border-radius:14px;background:var(--t3);color:var(--c3);display:grid;place-items:center}
.tonight .ic svg{width:24px;height:24px}
.tonight .nm{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.pick{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pick button{all:unset;cursor:pointer;padding:10px 12px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px}
.pick button:first-child{border-top:0}
.pick button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pick button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{all:unset;cursor:pointer;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tagpick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagpick button:focus-visible{outline:2px solid var(--accent)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
textarea{resize:vertical;min-height:90px;line-height:1.4}
/* shop */
.aisle{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:14px 4px 4px;display:flex;justify-content:space-between}
.aisle:first-child{padding-top:0}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line2);--cc:var(--accent)}
.aisle + .srow{border-top:0}
.srow > div{min-width:0;overflow:hidden}
.srow .body{all:unset;min-width:0;display:block;max-width:100%}
.srow .body.tap{cursor:pointer}
.srow .nm{font-weight:600}
.srow.got .nm{text-decoration:line-through;color:var(--muted);font-weight:500}
.srow .sub{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .need{font-family:var(--f-mono);font-size:.86rem;white-space:nowrap;text-align:right}
.spill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--t0);color:var(--c0);margin-top:3px}
.spill.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.spill:focus-visible{outline:2px solid var(--accent)}
.storeh{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding:16px 4px 2px;display:flex;justify-content:space-between;align-items:baseline}
.storeh:first-child{padding-top:0}
.storeh span{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:600}

/* done view */
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line2)}
.drow:first-child{border-top:0}
.drow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .sub{font-size:.82rem;color:var(--muted)}
.dayh{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:14px 4px 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:701px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
@media (min-width:701px){.sheet{border-radius:18px;padding:20px;max-height:100%}.sheet::before{display:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:1.25rem;font-weight:800}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none;flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2 .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;min-width:0}
.f input,.f select,.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.bigname{all:unset;box-sizing:border-box;width:100%;font-family:var(--f-display);font-weight:700;font-size:1.6rem;border-bottom:2px solid var(--line);padding:4px 2px}
.bigname:focus{border-color:var(--accent)}
label.cb{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
label.cb input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.hint{font-size:.84rem;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:.9rem}
.err:empty{display:none}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 2px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sticky-actions .btn.primary{flex:1;max-width:260px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

<script>
/* ======================================================================
   STATE
   ====================================================================== */
const POLL_MS=10000;
let people=[], me=null, items=[], lists=[], events=[], due=null, today=null, loaded=false, linkMe=null, busy=0;
let recipes=[], plan=[], checks=[], settings={}, mealWk="this", shopWk=null, rsearch="", rtag="", planMsg="", shopStore="", shopGroup="aisle";
let view="home", listView="all", q="", showDone=false, collapsed=new Set(), confirmList=null, renaming=null, managing=false, showPast=false;
let S=null;   // open sheet

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:n%1?2:0}).format(n);
const num=v=>{const n=parseFloat(String(v??"").replace(/[$,\s]/g,""));return isFinite(n)?Math.round(n*100)/100:null;};
const isUrl=s=>/^https?:\/\//i.test(s||"");
const names=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const listOf=c=>lists.find(l=>l.id===c);
const label=c=>(listOf(c)||{}).label||"Other";
const catVars=c=>{const n=((listOf(c)||{}).color||0)%6;return `--cc:var(--c${n});--tc:var(--t${n})`;};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2400);}
function setStatus(t){const s=$("#status");s.hidden=!t;s.textContent=t||"";}
function call(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));}
function saveCollapsed(){store.set("collapsed",JSON.stringify([...collapsed]));}

/* ======================================================================
   DATES & COUNTDOWNS
   ====================================================================== */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const todayStr=()=>today||ymd(new Date());
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const nthDow=(y,m,dow,n)=>{const d=new Date(y,m,1);const off=(dow-d.getDay()+7)%7;return new Date(y,m,1+off+7*(n-1));};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const HOLIDAYS=[
  ["newyear","New Year's Day",y=>new Date(y,0,1)],
  ["valentines","Valentine's Day",y=>new Date(y,1,14)],
  ["easter","Easter",y=>easter(y)],
  ["mothers","Mother's Day",y=>nthDow(y,4,0,2)],
  ["fathers","Father's Day",y=>nthDow(y,5,0,3)],
  ["july4","Independence Day",y=>new Date(y,6,4)],
  ["halloween","Halloween",y=>new Date(y,9,31)],
  ["thanksgiving","Thanksgiving",y=>nthDow(y,10,4,4)],
  ["blackfriday","Black Friday",y=>{const t=nthDow(y,10,4,4);return new Date(y,10,t.getDate()+1);}],
  ["christmas","Christmas",y=>new Date(y,11,25)],
  ["nye","New Year's Eve",y=>new Date(y,11,31)]
];
const hiddenHol=()=>new Set(events.filter(e=>e.kind==="hidden").map(e=>String(e.id).replace(/^hide-/,"")));
function nextHoliday(fn){ const t=todayStr(), y=parseD(t).getFullYear(); let d=ymd(fn(y)); if(d<t) d=ymd(fn(y+1)); return d; }

/* Every countdown, next occurrence first. */
function countdowns(){
  const t=todayStr(), out=[], hide=hiddenHol();
  HOLIDAYS.forEach(([key,name,fn])=>{ if(!hide.has(key)) out.push({id:"hol:"+key,key,name,kind:"holiday",start:nextHoliday(fn),end:"",builtin:true}); });
  if(due && /^\d{4}-\d{2}-\d{2}$/.test(due) && diffDays(due,t)<=30) out.push({id:"baby",name:"Baby's due date",kind:"baby",start:due,end:"",builtin:true});
  events.filter(e=>e.kind!=="hidden").forEach(e=>{
    let s=e.start, en=e.end||"";
    if(e.yearly){ const y=parseD(t).getFullYear(), span=en?diffDays(s,en):0;
      for(const yy of [y-1,y,y+1]){ const ns=yy+s.slice(4), ne=span?ymd(new Date(parseD(ns).getTime()+span*864e5)):""; if((ne||ns)>=t){ s=ns; en=ne; break; } } }
    out.push(Object.assign({},e,{start:s,end:en}));
  });
  return out.map(c=>{ const last=c.end||c.start, d=diffDays(t,c.start), past=last<t, now=!past&&c.start<=t;
    return Object.assign(c,{days:d, past, now, dayOf: now&&c.end ? diffDays(c.start,t)+1 : 0, length: c.end?diffDays(c.start,c.end)+1:1}); })
    .sort((a,b)=>(a.past-b.past)|| (a.past ? b.start.localeCompare(a.start) : a.start.localeCompare(b.start)));
}
function dateLabel(c){
  const s=parseD(c.start), f=d=>`${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`+(d.getFullYear()!==parseD(todayStr()).getFullYear()?`, ${d.getFullYear()}`:"");
  let txt=f(s); if(c.end){ const e=parseD(c.end); txt+=` – ${e.getMonth()===s.getMonth()?e.getDate():MON[e.getMonth()]+" "+e.getDate()}`; }
  if(c.time){ const[h,m]=c.time.split(":").map(Number); txt+=` · ${((h+11)%12)+1}:${pad(m)} ${h<12?"AM":"PM"}`; }
  return txt;
}
function bigCount(c){
  if(c.now) return c.end?{n:`Day ${c.dayOf}`,u:`of ${c.length}`}:{n:"Today",u:""};
  if(c.past) return {n:String(-diffDays(c.end||c.start,todayStr())),u:"days ago"};
  if(c.days===1) return {n:"1",u:"day"};
  return {n:String(c.days),u:"days"};
}
function weeksText(d){ if(d<14) return ""; const w=Math.floor(d/7), r=d%7; return `${w} weeks${r?` ${r} day${r>1?"s":""}`:""}`; }
const kindLabel=k=>({holiday:"Holiday",baby:"Baby",party:"Party",concert:"Concert",vacation:"Vacation",birthday:"Birthday",appointment:"Appointment",other:"Event"})[k]||"Event";

/* ======================================================================
   MEALS & SHOP
   ====================================================================== */
const GROC="groceries";
const realLists=()=>lists.filter(l=>l.id!==GROC);
const AISLES=["Produce","Meat & seafood","Dairy & eggs","Bakery","Frozen","Pantry","Spices","Household","Other"];
const TAGS=["Vegan","Vegetarian","Pescatarian","Dairy-free","Gluten-free","Quick","Kid-friendly","Slow cooker"];
const DIETS=["Vegan","Vegetarian","Pescatarian","Dairy-free","Gluten-free"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const weekStart=t=>{const d=parseD(t);d.setDate(d.getDate()-d.getDay());return ymd(d);};
const thisWeek=()=>weekStart(todayStr()), nextWeek=()=>addD(thisWeek(),7);
const recipeOf=id=>recipes.find(r=>r.id===id);
function tagsOf(r){ const t=new Set(r.tags||[]); if(t.has("Vegan")){t.add("Vegetarian");t.add("Dairy-free");} if(t.has("Vegetarian")) t.add("Pescatarian"); return t; }
function rules(){ const R=Object.assign({diet:[],days:["any","any","any","any","any","takeout","any"],noRepeat:true,servings:2},settings.mealRules||{}); if(!Array.isArray(R.days)||R.days.length!==7) R.days=["any","any","any","any","any","takeout","any"]; return R; }
const staples=()=>Array.isArray(settings.staples)?settings.staples:["salt","black pepper","water"];
const STORES_DEFAULT=["Aldi","Costco","Ralphs","Sam's Club","Sprouts","Stater Bros","Target","Trader Joe's","Walmart","Whole Foods"];
const storeList=()=>Array.isArray(settings.stores)&&settings.stores.length?settings.stores:STORES_DEFAULT;
const storeFor=()=>settings.storeFor&&typeof settings.storeFor==="object"?settings.storeFor:{};
function nightsOf(week){ const a=Array(7).fill(null); plan.filter(p=>p.week===week).forEach(p=>{ if(p.day>=0&&p.day<7) a[p.day]=p; }); return a; }
const blankNight=()=>({kind:"meal",recipe:"",servings:0,leftovers:false,locked:false,cook:""});
const ruleLabel=r=>r==="any"?"Any":r==="takeout"?"Takeout":r==="skip"?"No dinner":r;

/* Random draw: honours household diet, per-night rules, favourites (3× as likely), "not for us" (never),
   no recipe twice in a week, and — when possible — nothing from last week. Locked and blank nights stay. */
function weightedPick(list){ const w=list.map(r=>r.fav>0?3:1), tot=w.reduce((a,b)=>a+b,0); let x=Math.random()*tot; for(let i=0;i<list.length;i++){ x-=w[i]; if(x<=0) return list[i]; } return list[list.length-1]; }
function candidates(week,day,used){
  const R=rules(), rule=R.days[day]||"any", last=new Set(nightsOf(addD(week,-7)).filter(n=>n&&n.recipe).map(n=>n.recipe));
  let c=recipes.filter(r=>r.fav>=0 && R.diet.every(t=>tagsOf(r).has(t)) && !used.has(r.id) && (rule==="any"||rule==="takeout"||rule==="skip"||tagsOf(r).has(rule)));
  if(R.noRepeat){ const f=c.filter(r=>!last.has(r.id)); if(f.length) c=f; }
  return c;
}
function drawWeek(week){
  const R=rules(), cur=nightsOf(week), out=[], missing=[];
  const used=new Set(cur.filter(n=>n&&n.locked&&n.recipe).map(n=>n.recipe));
  for(let d=0;d<7;d++){
    const n=cur[d]||blankNight();
    if(n.locked||n.kind==="skip"){ out.push(n); continue; }   // locked and blank nights are kept as they are
    const rule=R.days[d]||"any";
    if(rule==="takeout"||rule==="skip"){ out.push(Object.assign(blankNight(),{kind:rule,cook:n.cook})); continue; }
    const c=candidates(week,d,used);
    if(!c.length){ out.push(Object.assign(blankNight(),{cook:n.cook})); missing.push(DAYS[d]); continue; }
    const r=weightedPick(c); used.add(r.id);
    out.push(Object.assign(blankNight(),{recipe:r.id,servings:n.servings,leftovers:n.leftovers,cook:n.cook}));
  }
  return {out,missing};
}
function rerollNight(week,day){
  const cur=nightsOf(week), n=cur[day]||blankNight();
  const used=new Set(cur.filter((x,i)=>x&&x.recipe&&i!==day).map(x=>x.recipe)); if(n.recipe) used.add(n.recipe);
  const R=rules(), rule=R.days[day]; const c=candidates(week,day,used);
  if(!c.length) return null;
  return Object.assign({},n,{kind:"meal",recipe:weightedPick(c).id,locked:false});
}

/* Ingredient lines → {q,u,name,key,aisle} */

/* Turn the text read from a recipe photo into name / servings / minutes / ingredients / steps. */
function parseRecipeText(text){

    m=l.match(/\btotal( time)?\s*:?\s*(?:(\d+)\s*h(?:ou)?rs?)?\s*(?:(\d+)\s*min)?/i); if(m&&(m[2]||m[3])&&!minutes) minutes=(+m[2]||0)*60+(+m[3]||0); });
  if(!minutes){ let t=0; raw.forEach(l=>{ for(const m of l.matchAll(/\b(prep|cook)(?:ing)?( time)?\s*:?\s*(?:(\d+)\s*h(?:ou)?rs?)?\s*(?:(\d+)\s*min)/gi)) t+=(+m[3]||0)*60+(+m[4]||0); }); if(t) minutes=t; }

  const head=raw.slice(0,iI>0?iI:Math.min(4,raw.length)).filter(l=>!meta(l)&&!isIngH(l)&&!isStepH(l)&&l.length<=70&&!/^\d/.test(l));
  name=head[0]||"";
  const qtyLine=l=>/^((\d+\s+)?\d+\/\d+|\d*\.?\d+|[½¼¾⅓⅔⅛])\s*\S/.test(bullet(l));
  if(iI>=0){
    ings=raw.slice(iI+1,iS>iI?iS:undefined).map(bullet).filter(l=>!meta(l)&&!isStepH(l));
    if(iS<0){ // no steps heading: ingredients end where long sentences begin

    else steps=raw.slice(iS+1);

}

function stats(list){
  let budget=0,spent=0,left=0,leftBudget=0,done=0;
  for(const i of list){ budget+=i.est||0; if(i.bought){done++;spent+=(i.paid??i.est??0);} else {left++;leftBudget+=i.est||0;} }
  return {budget,spent,left,leftBudget,done,total:list.length};
}

function ingPreview(t){ const ing=String(t||"").split("\n").map(x=>x.trim()).filter(Boolean).map(parseIng);

function pickHTML(sel,q){ q=String(q||"").toLowerCase(); const R=rules();
  const list=recipes.filter(r=>r.fav>=0||r.id===sel).filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>(b.id===sel)-(a.id===sel)||(b.fav-a.fav)||a.name.localeCompare(b.name));
  return list.map(r=>{ const ok=R.diet.every(t=>tagsOf(r).has(t)); return `<button type="button" data-rpick="${esc(r.id)}" aria-pressed="${r.id===sel}"><span>${r.fav>0?"★ ":""}${esc(r.name)}</span><span class="muted" style="font-size:.8rem">${ok?"":"outside your diet rules · "}${r.minutes?r.minutes+" min":""}</span></button>`; }).join("")||`<div class="empty">No recipes match.</div>`; }
function grab(){ if(!S) return; document.querySelectorAll("#sheet [data-k]").forEach(el=>{ S.vals[el.dataset.k]=el.type==="checkbox"?el.checked:el.value; }); }
function grabRules(){ grab(); const v=S.vals, R=v.R; for(let i=0;i<7;i++) if(v["day"+i]!=null) R.days[i]=v["day"+i]; if(v.rservings!=null) R.servings=Math.max(1,Math.min(20,parseInt(v.rservings)||2)); if(v.noRepeat!=null) R.noRepeat=!!v.noRepeat; }

    closeSheet(); const sc=scrollY; render(); scrollTo(0,sc); toast(st?`${r?r.name:"Item"} → ${st}`:"Any store"); return; }

$("#sheet").addEventListener("submit",async e=>{
  e.preventDefault(); if(!S) return; grab(); const v=S.vals, k=S.kind;
  if(k==="night"){ const btn=$("#sSave"); btn.disabled=true; btn.textContent="Saving…";
    const n={kind:v.kind,recipe:v.kind==="meal"?(v.recipe||""):"",servings:parseInt(v.servings)||0,leftovers:!!v.leftovers,locked:!!v.locked,cook:v.cook||""};

  if(k==="stores"){ const arr=[...new Set(String(v.text||"").split(/[\n,]/).map(x=>x.trim()).filter(Boolean))].slice(0,40); if(!arr.length){ S.err="Add at least one store."; return rerender(); } const ok=await write("setSetting","stores",arr); if(ok){ closeSheet(); toast("Stores saved"); } return; }
  if(k==="staples"){ const arr=String(v.text||"").split(/[\n,]/).map(x=>x.trim()).filter(Boolean).slice(0,80); const ok=await write("setSetting","staples",arr); if(ok){ closeSheet(); toast("Staples saved"); } return; }
  if(k==="recipe"){ const r={name:String(v.name||"").trim(),tags:v.tags||[],servings:parseInt(v.servings)||4,minutes:parseInt(v.minutes)||0,ingredients:v.ingredients||"",steps:v.steps||"",link:v.link||"",by:me};
    if(!r.name){ S.err="Name the recipe."; return rerender(); } if(!String(r.ingredients).trim()){ S.err="Add at least one ingredient."; return rerender(); }
    const btn=$("#sSave"); btn.disabled=true; btn.textContent="Saving…";
    const ok=S.mode==="edit"?await write("updateRecipe",S.rec.id,r):await write("addRecipe",r);
    if(ok){ closeSheet(); toast(S&&S.mode==="edit"?"Recipe saved":"Recipe added"); } else if(S){ S.err=write.lastErr; renderSheet(); } return; }
  const name=String(v.name||"").trim(); if(!name){ S.err=k==="list"?"Name the list.":k==="event"?"Name the event.":"What's the item?"; return rerender(); }
  const btn=$("#sSave"); btn.disabled=true; btn.textContent="Saving…";
  let ok=false, msg="";
  if(k==="item"){
    const f={name,cat:v.cat,section:String(v.section||"").trim()||null,est:num(v.est),store:String(v.store||"").trim()||null,notes:String(v.notes||"").trim()||null,prio:v.prio,both:!!v.both};
    if(f.cat===GROC && !f.store){ const sf=storeFor()[normKey(name)]; if(sf) f.store=sf; }
    if(S.mode==="edit"){ f.paid=num(v.paid); ok=await write("updateItem",S.rec.id,f); msg="Saved"; }
    else { f.by=me; f.doneBy=null; if(f.cat===GROC&&!f.section) f.section=guessAisle(f.name); ok=await write("addItem",f); msg=f.cat===GROC?"Added to Shop":`Added to ${label(f.cat)}`; if(ok){ S.vals={cat:f.cat,section:f.cat===GROC?"":f.section,store:f.cat===GROC?(v.store||""):undefined}; } }
  }
  if(k==="event"){
    if(!v.start){ S.err="Pick a date."; btn.disabled=false; btn.textContent=S.mode==="edit"?"Save":"Add"; return rerender(); }
    const ev={name,kind:v.kind,start:v.start,end:v.end||"",time:v.time||"",place:v.place||"",notes:v.notes||"",yearly:!!v.yearly,list:v.list||"",by:me};
    ok = S.mode==="edit" ? await write("updateEvent",S.rec.id,ev) : await write("addEvent",ev); msg=S.mode==="edit"?"Event saved":"Countdown added";
    if(ok){ closeSheet(); view="dates"; render(); toast(msg); return; }
  }
  if(k==="list"){ ok=await write("addList",name); msg=`Added “${name}”`; if(ok){ const l=lists.find(x=>x.label===name); closeSheet(); if(l){ listView=l.id; view="lists"; render(); } toast(msg); return; } }
  if(!S) return;
  if(ok){ if(S.mode==="edit"){ closeSheet(); toast(msg); } else { toast(msg+". Add another or close."); renderSheet(); setTimeout(()=>{const a=$("#sheet .bigname"); a&&a.focus();},30); } }
  else { S.err=write.lastErr||"Couldn't save. Check your connection and try again."; renderSheet(); }
});

function apply(d){
  if(!d) return;
  people=d.people||people; lists=d.lists||lists; due=d.due||due; events=d.events||[]; today=d.today||today;
  recipes=d.recipes||recipes; plan=d.plan||[]; checks=d.checks||[]; settings=d.settings||{};
  if(d.appName){ $("#appName").textContent=d.appName; document.title=d.appName; }
  if(linkMe){ const hit=people.find(p=>p.toLowerCase()===linkMe.toLowerCase()); if(hit){ me=hit; store.set("me",me); } }
  items=d.items||[]; loaded=true; setStatus("");
  $("#asof").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  if(renaming&&!listOf(renaming)) renaming=null;
  const ae=document.activeElement; const typing=ae&&ae.id==="q"; const pos=typing?ae.selectionStart:0;
  if(!renaming){ const sc=scrollY; render(); scrollTo(0,sc); }
  if(typing){ const n=$("#q"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } }
}
async function refresh(){
  if(busy||S) return; const b=$("#refreshBtn"); b.classList.add("spin");
  try{ const d=await call("getData"); if(!busy&&!S) apply(d); }
  catch(e){ if(!loaded) setStatus("Couldn't load your lists. Check your connection and reload."); }
  b.classList.remove("spin");
}
async function write(fn,...args){
  busy++;
  try{ const d=await call(fn,...args); busy--; if(busy===0) apply(d); return true; }   // only the newest reply repaints, so quick taps aren't undone
  catch(e){ busy--; write.lastErr=String((e&&e.message)||e).replace(/^Error:\s*/,""); toast(write.lastErr); refresh(); return false; }
}

document.addEventListener("click",async e=>{
  if(e.target.closest("#sheet")) return;

  if(ds.go){ view=ds.go; store.set("view",view); render(); scrollTo(0,0); return; }

  if(ds.cd){ const c=countdowns().find(x=>x.id===ds.cd); if(!c) return;
    if(c.builtin){ view="dates"; render(); scrollTo(0,0); return; }
    const ev=events.find(x=>x.id===c.id); if(ev) openSheet("event",{rec:ev,vals:Object.assign({},ev)}); return; }
  if(ds.past){ showPast=!showPast; render(); return; }
  if(ds.mw){ mealWk=ds.mw; planMsg=""; render(); return; }
  if(ds.sw){ shopWk=ds.sw; render(); return; }
  if(ds.sstore!==undefined && b.hasAttribute("data-sstore")){ shopStore=ds.sstore; store.set("shopStore",shopStore); render(); return; }
  if(ds.storepick){ openSheet("storepick",{vals:{key:ds.storepick}}); return; }
  if(ds.stores){ openSheet("stores",{vals:{}}); return; }

  if(ds.recipe){ const r=recipeOf(ds.recipe); if(r) openSheet("recipe",{rec:r,vals:{name:r.name,tags:[...(r.tags||[])],servings:r.servings,minutes:r.minutes||"",ingredients:r.ingredients,steps:r.steps,link:r.link,fav:r.fav}}); return; }
  if(ds.rules){ openSheet("rules",{vals:{}}); return; }
  if(ds.scan){ $("#scanInput").click(); return; }
  if(ds.rboxall){ rboxAll=true; render(); return; }
  if(ds.staples){ openSheet("staples",{vals:{}}); return; }
  if(ds.planweek){ const week=mealWk==="next"?nextWeek():thisWeek(); if(!recipes.length){ toast("Add a recipe first"); return; }
    const {out,missing}=drawWeek(week); planMsg=missing.length?`No recipe fits the rules for ${missing.join(", ")}. Add recipes or loosen the rules.`:"";
    plan=plan.filter(p=>p.week!==week).concat(out.map((n,i)=>Object.assign({},n,{week,day:i}))); render();
    write("setWeekPlan",week,out).then(ok=>ok&&toast("Week planned")); return; }
  if(ds.nmode){ const week=mealWk==="next"?nextWeek():thisWeek(), d=+ds.d, cur=nightsOf(week)[d]||blankNight(), mode=cur.kind==="skip"?"blank":cur.locked?"lock":"redraw";
    let n;

      n=Object.assign({},cur,{locked:mode!=="lock"}); toast(n.locked?"Locked":"Will redraw"); }
    else if(ds.nmode==="blank"){ n=mode==="blank"?blankNight():Object.assign(blankNight(),{kind:"skip",cook:cur.cook}); toast(mode==="blank"?"Will redraw":"Left blank"); }
    else { // redraw: unlock / un-blank, and pick something right away

      plan=plan.filter(p=>!(p.week===week&&p.day===d)).concat([Object.assign({},base,{week,day:d})]);
      n=rerollNight(week,d); if(!n){ n=base; toast("No other recipe fits that night's rules"); } }
    plan=plan.filter(p=>!(p.week===week&&p.day===d)).concat([Object.assign({},n,{week,day:d})]); const sc=scrollY; render(); scrollTo(0,sc);
    write("setNight",week,d,n); return; }
  if(ds.night!==undefined && b.hasAttribute("data-night")){ const week=mealWk==="next"?nextWeek():thisWeek(), d=+ds.night, n=nightsOf(week)[d]||blankNight(); openSheet("night",{vals:Object.assign({},n,{week,day:d})}); return; }
  if(ds.clearshop){ const week=shopWeek();   // clear on screen right away, save in the background
    items=items.filter(i=>!(i.cat===GROC&&i.bought));
    checks=checks.map(c=>c.week===week&&!String(c.key).startsWith("x:")?Object.assign({},c,{key:"x:"+c.key}):c);
    const sc=scrollY; render(); scrollTo(0,sc); toast("Cleared");
    write("clearBoughtGroceries",week); return; }
  if(ds.pair){ const it=items.find(i=>i.id===ds.pair), person=ds.person; if(!it) return;
    if(!me||!people.includes(me)){ toast("Pick who you are at the top first"); return; }
    if(person!==me){ toast(`Only ${person} can check off their part`); return; }
    let d=names(it.doneBy); const done=!d.includes(me); d=done?[...d,me]:d.filter(n=>n!==me);
    it.doneBy=people.filter(p=>d.includes(p)).join(", "); it.bought=people.every(p=>d.includes(p)); render();
    write("markDone",it.id,me,done).then(ok=>{ if(ok&&it.bought) toast("Both done. Moved to Done."); }); return; }
  if(ds.rename){ renaming=ds.rename; confirmList=null; render(); const i=$("#rename-"+CSS.escape(renaming)); i&&(i.focus(),i.select()); return; }
  if(ds.renamecancel){ renaming=null; render(); return; }
  if(ds.renamesave){ saveRename(ds.renamesave); return; }
  if(ds.dellist){ confirmList=ds.dellist; renaming=null; render(); return; }
  if(ds.keeplist){ confirmList=null; render(); return; }
  if(ds.yesdellist){ const id=ds.yesdellist, nm=label(id); confirmList=null; if(listView===id) listView="all"; if(await write("deleteList",id)) toast(`Deleted “${nm}”`); return; }
});
async function saveRename(id){ const inp=$("#rename-"+CSS.escape(id)), name=inp?inp.value.trim():""; if(!name) return; renaming=null; if(await write("renameList",id,name)) toast("Renamed"); }
document.addEventListener("submit",e=>{ const f=e.target.closest("[data-renameform]"); if(f){ e.preventDefault(); saveRename(f.dataset.renameform); } });
document.addEventListener("change",e=>{
  const el=e.target; if(el.closest("#sheet")) return;
  if(el.dataset.toggle){ const it=items.find(i=>i.id===el.dataset.toggle); if(!it) return; const bought=el.checked;
    const patch=bought?{bought:true,boughtBy:me,boughtAt:Date.now(),paid:it.paid??it.est??null}:{bought:false,boughtBy:null,boughtAt:null};
    Object.assign(it,patch); render(); write("updateItem",it.id,patch).then(ok=>{ if(ok&&!bought) toast("Moved back to the list"); }); return; }
  if(el.dataset.shop){ const week=shopWeek(), key=el.dataset.shop, on=el.checked, r=shopRows(week).list.find(x=>x.key===key); if(!r) return;
    if(r.meal){ checks=checks.filter(c=>!(c.week===week&&c.key===key)); if(on) checks.push({week,key,by:me}); }
    if(r.manual){ Object.assign(r.manual,on?{bought:true,boughtBy:me,boughtAt:Date.now()}:{bought:false,boughtBy:null,boughtAt:null}); }
    const sc=scrollY; render(); scrollTo(0,sc);
    if(r.meal) write("setShopCheck",week,key,on,me);
    if(r.manual) write("updateItem",r.manual.id,on?{bought:true,boughtBy:me,boughtAt:Date.now()}:{bought:false,boughtBy:null,boughtAt:null});
    return; }
  if(el.id==="groupStore"){ shopGroup=el.checked?"store":"aisle"; store.set("shopGroup",shopGroup); render(); return; }
  if(el.id==="showDone"){ showDone=el.checked; store.set("showDone",showDone?"1":"0"); $("#listBody").innerHTML=listBody(); return; }
  if(el.dataset.hol){ const key=el.dataset.hol, show=el.checked, sc=scrollY;
    events=events.filter(e=>!(e.kind==="hidden"&&e.id==="hide-"+key));            // update the screen right away
    if(!show) events.push({id:"hide-"+key,name:key,kind:"hidden"});
    render(); scrollTo(0,sc);
    write("setHoliday",key,show); return; }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ q=e.target.value; $("#listBody").innerHTML=listBody(); }
  if(e.target.id==="rsearch"){ rsearch=e.target.value; const qq=rsearch.trim().toLowerCase(); $("#rbox").innerHTML=rboxHTML(recipes.filter(r=>(!rtag||(rtag==="Favorites"?r.fav>0:tagsOf(r).has(rtag)))&&(!qq||(r.name+" "+r.ingredients).toLowerCase().includes(qq))).sort((a,b)=>(b.fav-a.fav)||a.name.localeCompare(b.name))); } });
$("#refreshBtn").addEventListener("click",()=>refresh());

/* ======================================================================
   BOOT
   ====================================================================== */
me=store.get("me");
{ const v=store.get("view"); if(["home","lists","dates","meals","shop","done"].includes(v)) view=v; }
showDone=store.get("showDone")==="1"; shopStore=store.get("shopStore")||""; shopGroup=store.get("shopGroup")==="store"?"store":"aisle";
try{ collapsed=new Set(JSON.parse(store.get("collapsed")||"[]")); }catch(_){ collapsed=new Set(); }
/* Personal links (…/exec?me=yourname) remember who's using the phone even when the phone clears saved data. */
try{ google.script.url.getLocation(l=>{ const m=l&&l.parameter&&l.parameter.me; if(m){ linkMe=String(m); const hit=people.find(p=>p.toLowerCase()===linkMe.toLowerCase()); if(hit){ me=hit; store.set("me",me); render(); } } }); }catch(_){}
render();
refresh();
setInterval(()=>{ if(!document.hidden) refresh(); },POLL_MS);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
